<title>ESP32 Full Wiring</title>
<meta name="viewport" content="width=device-width">
<style>
body{margin:0;background:#eef3f1;font-family:Vazirmatn,Tahoma,sans-serif;color:#14231f}
.w{max-width:900px;margin:0 auto;padding:14px;display:grid;gap:12px}
h1{direction:rtl;margin:0;font-size:24px}
.c{background:#fff;border:1px solid #c9d6d2;border-radius:12px;padding:10px}
svg{display:block;width:100%;height:auto}
svg text{font-family:monospace}
.k{direction:rtl;font-size:15px;line-height:1.8;color:#33443f}
.k span{display:inline-block;width:26px;height:6px;border-radius:3px;vertical-align:middle;margin-left:6px}
</style>
<div class="w">
<h1>گرێدانا هەمی پارچان پێکڤە — ESP32</h1>
<div class="c">
<svg viewBox="0 0 860 1060" xmlns="http://www.w3.org/2000/svg">
  <!-- ===== wires (drawn first, under boxes) ===== -->
  <g fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 3V3 rail: ESP32 3V3 -> OLED VCC, MIC VDD -->
    <path d="M330 300 H270 V95 H235" stroke="#d23a2e"/>
    <path d="M270 70 V40 H600 V80 H625" stroke="#d23a2e"/>
    <path d="M270 95 V70" stroke="#d23a2e"/>
    <!-- GND rail -->
    <path d="M330 340 H255 V120 H235" stroke="#222"/>
    <path d="M255 120 V55 H585 V105 H625" stroke="#222"/>
    <path d="M585 105 V130 H625" stroke="#222"/>
    <!-- SDA / SCL -->
    <path d="M330 380 H240 V145 H235" stroke="#2f6fd6"/>
    <path d="M330 420 H225 V170 H235" stroke="#d9a400"/>
    <!-- MIC I2S -->
    <path d="M530 300 H600 V155 H625" stroke="#2e9d4f"/>
    <path d="M530 340 H612 V180 H625" stroke="#8a4fd0"/>
    <path d="M530 380 H560 V205 H625" stroke="#e07a1f"/>
    <!-- Speaker signal G25 -> 1k -> LM386 IN -->
    <path d="M530 460 H575" stroke="#e07a1f"/>
    <path d="M625 460 H690 V520" stroke="#e07a1f"/>
    <!-- GND ESP right -> LM386 GND -->
    <path d="M530 420 H845 V935 H520" stroke="#222"/>
    <path d="M720 420 V520" stroke="#222"/>
    <!-- speaker wires -->
    <path d="M700 630 V700" stroke="#2e9d4f"/>
    <path d="M760 630 V700" stroke="#8a4fd0"/>
    <!-- battery chain -->
    <path d="M150 905 H190" stroke="#d23a2e"/><path d="M150 935 H190" stroke="#222"/>
    <path d="M330 905 H380" stroke="#d23a2e"/><path d="M330 935 H380" stroke="#222"/>
    <path d="M520 905 H585" stroke="#d23a2e"/>
    <!-- switch -> 5V rail -> ESP VIN + LM386 VCC -->
    <path d="M665 905 H820 V500 H750 V520" stroke="#d23a2e"/>
    <path d="M820 820 H300 V660 H330" stroke="#d23a2e"/>
    <!-- battery sense: B+ -> 100k -> G34 -> 100k -> GND -->
    <path d="M100 880 V800 H120" stroke="#c9822b" stroke-width="3"/>
    <path d="M160 800 H200 V460 H330" stroke="#c9822b" stroke-width="3"/>
    <path d="M200 760 H220" stroke="#c9822b" stroke-width="3"/>
    <path d="M260 760 H275 V790" stroke="#222" stroke-width="3"/>
  </g>
  <!-- 10nF cap from IN line to GND -->
  <path d="M650 460 V478 M636 478 H664 M636 486 H664 M650 486 V500" stroke="#333" stroke-width="2.5" fill="none"/>
  <text x="604" y="512" font-size="11" fill="#333">10nF→GND</text>
  <!-- resistors -->
  <rect x="575" y="451" width="50" height="18" rx="3" fill="#fff" stroke="#333" stroke-width="2"/><text x="600" y="465" font-size="11" text-anchor="middle">1kΩ</text>
  <rect x="120" y="792" width="40" height="16" rx="3" fill="#fff" stroke="#333" stroke-width="2"/><text x="140" y="788" font-size="10" text-anchor="middle">100k</text>
  <rect x="220" y="752" width="40" height="16" rx="3" fill="#fff" stroke="#333" stroke-width="2"/><text x="240" y="748" font-size="10" text-anchor="middle">100k</text>

  <!-- ===== OLED ===== -->
  <rect x="40" y="60" width="195" height="130" rx="8" fill="#111"/>
  <rect x="55" y="75" width="120" height="70" fill="#123"/>
  <rect x="75" y="90" width="28" height="36" rx="6" fill="#7fd4ff"/><rect x="125" y="90" width="28" height="36" rx="6" fill="#7fd4ff"/>
  <text x="105" y="175" font-size="13" fill="#fff" text-anchor="middle">OLED</text>
  <g font-size="12" fill="#fff" text-anchor="end"><text x="230" y="99">VCC</text><text x="230" y="124">GND</text><text x="230" y="149">SDA</text><text x="230" y="174">SCL</text></g>

  <!-- ===== MIC ===== -->
  <rect x="625" y="60" width="200" height="160" rx="8" fill="#1d4fa8"/>
  <circle cx="770" cy="140" r="34" fill="#0d2d66"/><circle cx="770" cy="140" r="10" fill="#ccc"/>
  <text x="770" y="200" font-size="13" fill="#fff" text-anchor="middle">INMP441</text>
  <g font-size="12" fill="#fff"><text x="632" y="84">VDD</text><text x="632" y="109">GND</text><text x="632" y="134">L/R</text><text x="632" y="159">SCK</text><text x="632" y="184">WS</text><text x="632" y="209">SD</text></g>

  <!-- ===== ESP32 ===== -->
  <rect x="330" y="260" width="200" height="440" rx="12" fill="#163b33"/>
  <rect x="380" y="275" width="100" height="80" rx="4" fill="#cfd6d4"/><text x="430" y="320" font-size="16" text-anchor="middle" fill="#14231f">ESP32</text>
  <rect x="410" y="690" width="40" height="18" rx="3" fill="#9aa5a2"/><text x="430" y="726" font-size="11" text-anchor="middle">USB-C</text>
  <rect x="345" y="600" width="26" height="18" rx="3" fill="#e8e8e8"/><text x="358" y="594" font-size="10" fill="#e8e8e8" text-anchor="middle">BOOT</text>
  <g font-size="13" fill="#e8f2ef">
    <text x="338" y="305">3V3</text><text x="338" y="345">GND</text><text x="338" y="385">G21</text><text x="338" y="425">G22</text><text x="338" y="465">G34</text><text x="338" y="665">VIN</text>
    <text x="522" y="305" text-anchor="end">G14</text><text x="522" y="345" text-anchor="end">G15</text><text x="522" y="385" text-anchor="end">G32</text><text x="522" y="425" text-anchor="end">GND</text><text x="522" y="465" text-anchor="end">G25</text>
  </g>
  <text x="430" y="760" font-size="0">.</text>

  <!-- ===== LM386 ===== -->
  <rect x="660" y="520" width="140" height="110" rx="8" fill="#1d4fa8"/>
  <text x="730" y="585" font-size="15" fill="#fff" text-anchor="middle">LM386</text>
  <g font-size="11" fill="#fff"><text x="672" y="538">IN</text><text x="706" y="538">GND</text><text x="742" y="538">VCC</text><text x="680" y="622">OUT+</text><text x="745" y="622">OUT−</text></g>
  <!-- speaker -->
  <circle cx="730" cy="735" r="40" fill="#222"/><circle cx="730" cy="735" r="14" fill="#555"/>
  <text x="730" y="800" font-size="12" text-anchor="middle">Speaker 8Ω</text>

  <!-- ===== power chain ===== -->
  <rect x="40" y="880" width="110" height="80" rx="8" fill="#222"/><text x="95" y="915" font-size="12" fill="#fff" text-anchor="middle">Li-ion</text><text x="95" y="935" font-size="12" fill="#fff" text-anchor="middle">3.6V</text>
  <text x="156" y="900" font-size="11">+</text><text x="156" y="950" font-size="11">−</text>
  <rect x="190" y="880" width="140" height="80" rx="8" fill="#1d4fa8"/><text x="260" y="925" font-size="14" fill="#fff" text-anchor="middle">TP4056</text>
  <text x="260" y="975" font-size="11" text-anchor="middle">B+ B− → OUT+ OUT−</text>
  <rect x="380" y="880" width="140" height="80" rx="8" fill="#1d4fa8"/><text x="450" y="918" font-size="14" fill="#fff" text-anchor="middle">MT3608</text><text x="450" y="940" font-size="11" fill="#fff" text-anchor="middle">5.0V</text>
  <text x="450" y="975" font-size="11" text-anchor="middle">IN → OUT</text>
  <rect x="585" y="885" width="80" height="45" rx="6" fill="#111"/><rect x="600" y="893" width="50" height="28" rx="4" fill="#c22"/>
  <text x="625" y="950" font-size="11" text-anchor="middle">ON/OFF</text>
  <text x="814" y="812" font-size="12" text-anchor="end" fill="#d23a2e">5V</text>
  <text x="275" y="806" font-size="11" text-anchor="middle">GND</text>
  <text x="430" y="1030" font-size="13" text-anchor="middle" fill="#555">All GND (black) are connected together</text>
</svg>
</div>
<div class="c k">
<div><span style="background:#d23a2e"></span>سۆر = هێز (3V3 بۆ OLED و مایکرۆفۆن، 5V بۆ VIN و LM386)</div>
<div><span style="background:#222"></span>ڕەش = GND (هەمی پێکڤە)</div>
<div><span style="background:#2f6fd6"></span>شین = SDA ← G21</div>
<div><span style="background:#d9a400"></span>زەر = SCL ← G22</div>
<div><span style="background:#2e9d4f"></span>کەسک = SCK ← G14</div>
<div><span style="background:#8a4fd0"></span>مۆر = WS ← G15</div>
<div><span style="background:#e07a1f"></span>پرتەقالی = SD ← G32 ، و دەنگ G25 ← 1kΩ ← IN</div>
<div><span style="background:#c9822b"></span>پێڤانا پاتریێ: + ← 100k ← G34 ← 100k ← GND</div>
</div>
</div>
