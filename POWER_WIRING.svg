<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Battery Power: 18650 + TP4056 + MT3608 → ESP32 + OLED + IR</text>
  <text x="600" y="70" text-anchor="middle" font-size="20" fill="#555" direction="rtl">گرێدانا باتری و هەردوو بۆردان دگەل ESP32</text>

  <!-- ===== Wires (drawn first, under the boards) ===== -->
  <g fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Battery -> TP4056 -->
    <polyline points="260,135 400,135" stroke="#d62728"/>
    <polyline points="260,185 400,185" stroke="#222"/>
    <!-- TP4056 -> switch -> MT3608 -->
    <polyline points="640,135 700,135" stroke="#2ca02c"/>
    <polyline points="760,135 820,135" stroke="#2ca02c"/>
    <polyline points="640,185 820,185" stroke="#222"/>
    <!-- MT3608 -> ESP32 -->
    <polyline points="1080,135 1140,135 1140,380 1040,380 1040,420" stroke="#d62728"/>
    <polyline points="1080,185 1110,185 1110,340 980,340 980,420" stroke="#222"/>
    <!-- OLED -> ESP32 -->
    <polyline points="340,480 640,480 640,500 780,500" stroke="#d62728"/>
    <polyline points="340,510 610,510 610,550 780,550" stroke="#222"/>
    <polyline points="340,540 580,540 580,620 780,620" stroke="#ff7f0e"/>
    <polyline points="340,570 550,570 550,670 780,670" stroke="#1f77b4"/>
    <!-- IR -> ESP32 -->
    <polyline points="340,730 780,730" stroke="#9467bd"/>
    <polyline points="340,800 860,800 860,780" stroke="#d62728"/>
    <polyline points="340,830 920,830 920,780" stroke="#222"/>
  </g>

  <!-- Switch -->
  <g stroke="#2ca02c" stroke-width="4" fill="#fff">
    <circle cx="700" cy="135" r="5"/>
    <circle cx="760" cy="135" r="5"/>
    <line x1="704" y1="132" x2="752" y2="110"/>
  </g>
  <text x="730" y="100" text-anchor="middle" font-size="14" fill="#555">ON/OFF switch</text>
  <text x="730" y="160" text-anchor="middle" font-size="12" fill="#888">(optional)</text>

  <!-- ===== Battery ===== -->
  <rect x="60" y="110" width="200" height="100" rx="14" fill="#f3e6f5" stroke="#b03fb5" stroke-width="4"/>
  <rect x="260" y="140" width="10" height="40" fill="#b03fb5"/>
  <text x="160" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">18650 Li-ion</text>
  <text x="160" y="178" text-anchor="middle" font-size="18" fill="#222">3.7V</text>
  <text x="245" y="130" text-anchor="end" font-size="22" font-weight="bold" fill="#d62728">+</text>
  <text x="245" y="200" text-anchor="end" font-size="26" font-weight="bold" fill="#222">−</text>

  <!-- ===== TP4056 ===== -->
  <rect x="400" y="90" width="240" height="180" rx="8" fill="#1f4e9c" stroke="#0d2f66" stroke-width="3"/>
  <text x="520" y="160" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">TP4056</text>
  <text x="520" y="185" text-anchor="middle" font-size="13" fill="#cfe0ff">Charger</text>
  <text x="412" y="140" font-size="15" fill="#fff">B+</text>
  <text x="412" y="190" font-size="15" fill="#fff">B−</text>
  <text x="628" y="140" text-anchor="end" font-size="15" fill="#fff">OUT+</text>
  <text x="628" y="190" text-anchor="end" font-size="15" fill="#fff">OUT−</text>
  <rect x="490" y="240" width="60" height="30" rx="4" fill="#c0c0c0" stroke="#666"/>
  <text x="520" y="295" text-anchor="middle" font-size="14" fill="#333">Micro USB 5V (charging)</text>

  <!-- ===== MT3608 ===== -->
  <rect x="820" y="90" width="260" height="180" rx="8" fill="#1f5fae" stroke="#0d2f66" stroke-width="3"/>
  <text x="950" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">MT3608</text>
  <text x="950" y="175" text-anchor="middle" font-size="13" fill="#cfe0ff">Boost 3.7V → 5V</text>
  <rect x="925" y="195" width="50" height="50" rx="4" fill="#3a7bd5" stroke="#cfe0ff"/>
  <circle cx="935" cy="235" r="6" fill="#d4a017"/>
  <text x="950" y="262" text-anchor="middle" font-size="12" fill="#fff">adjust pot</text>
  <text x="832" y="140" font-size="15" fill="#fff">VIN+</text>
  <text x="832" y="190" font-size="15" fill="#fff">VIN−</text>
  <text x="1068" y="140" text-anchor="end" font-size="15" fill="#fff">VOUT+</text>
  <text x="1068" y="190" text-anchor="end" font-size="15" fill="#fff">VOUT−</text>
  <text x="1150" y="260" font-size="15" font-weight="bold" fill="#d62728" transform="rotate(90 1150 260)">5.0V</text>

  <!-- ===== Warning ===== -->
  <rect x="380" y="320" width="420" height="80" rx="8" fill="#fff4e5" stroke="#e67e22" stroke-width="2"/>
  <text x="590" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">⚠ Set MT3608 output to 5.0V with a</text>
  <text x="590" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">multimeter BEFORE connecting the ESP32!</text>
  <text x="590" y="392" text-anchor="middle" font-size="13" fill="#555">Unplug the battery when using USB to upload code.</text>

  <!-- ===== ESP32 ===== -->
  <rect x="780" y="420" width="300" height="360" rx="10" fill="#2b2b2b" stroke="#000" stroke-width="3"/>
  <rect x="870" y="570" width="120" height="90" rx="4" fill="#9aa0a6"/>
  <text x="930" y="622" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">ESP32</text>
  <text x="980" y="445" text-anchor="middle" font-size="13" fill="#fff">GND</text>
  <text x="1040" y="445" text-anchor="middle" font-size="13" fill="#fff">VIN</text>
  <text x="792" y="505" font-size="14" fill="#fff">3V3</text>
  <text x="792" y="555" font-size="14" fill="#fff">GND</text>
  <text x="792" y="625" font-size="14" fill="#fff">G22</text>
  <text x="792" y="675" font-size="14" fill="#fff">G21</text>
  <text x="792" y="735" font-size="14" fill="#fff">G34</text>
  <text x="860" y="770" text-anchor="middle" font-size="13" fill="#fff">3V3</text>
  <text x="920" y="770" text-anchor="middle" font-size="13" fill="#fff">GND</text>

  <!-- ===== OLED ===== -->
  <rect x="80" y="440" width="260" height="170" rx="8" fill="#1a1a1a" stroke="#000" stroke-width="3"/>
  <rect x="100" y="470" width="160" height="100" fill="#0b2a4a" stroke="#4fa3ff"/>
  <text x="180" y="515" text-anchor="middle" font-size="16" font-weight="bold" fill="#4fa3ff">OLED</text>
  <text x="180" y="538" text-anchor="middle" font-size="13" fill="#4fa3ff">128x64 I2C</text>
  <text x="328" y="485" text-anchor="end" font-size="13" fill="#fff">VCC</text>
  <text x="328" y="515" text-anchor="end" font-size="13" fill="#fff">GND</text>
  <text x="328" y="545" text-anchor="end" font-size="13" fill="#fff">SCL</text>
  <text x="328" y="575" text-anchor="end" font-size="13" fill="#fff">SDA</text>

  <!-- ===== IR sensor ===== -->
  <rect x="80" y="690" width="260" height="160" rx="8" fill="#14532d" stroke="#0a2e18" stroke-width="3"/>
  <circle cx="130" cy="750" r="18" fill="#222" stroke="#999"/>
  <circle cx="130" cy="805" r="18" fill="#cfe8ff" stroke="#999"/>
  <text x="200" y="785" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">IR Sensor</text>
  <text x="328" y="735" text-anchor="end" font-size="13" fill="#fff">OUT</text>
  <text x="328" y="805" text-anchor="end" font-size="13" fill="#fff">VCC</text>
  <text x="328" y="835" text-anchor="end" font-size="13" fill="#fff">GND</text>

  <!-- ===== Legend ===== -->
  <g font-size="14" fill="#333">
    <text x="60" y="250" font-weight="bold">Wires</text>
    <line x1="60" y1="270" x2="100" y2="270" stroke="#d62728" stroke-width="5"/><text x="110" y="275">Positive (+)</text>
    <line x1="60" y1="295" x2="100" y2="295" stroke="#222" stroke-width="5"/><text x="110" y="300">Ground (−)</text>
    <line x1="60" y1="320" x2="100" y2="320" stroke="#2ca02c" stroke-width="5"/><text x="110" y="325">Battery out (3.7–4.2V)</text>
    <line x1="60" y1="345" x2="100" y2="345" stroke="#ff7f0e" stroke-width="5"/><text x="110" y="350">SCL</text>
    <line x1="200" y1="345" x2="240" y2="345" stroke="#1f77b4" stroke-width="5"/><text x="250" y="350">SDA</text>
    <line x1="60" y1="370" x2="100" y2="370" stroke="#9467bd" stroke-width="5"/><text x="110" y="375">IR signal</text>
  </g>
  <text x="1120" y="880" text-anchor="end" font-size="13" fill="#777">Both ESP32 3V3 and GND pins shown are the same nets.</text>
</svg>
