<!doctype html>
<html><head><meta charset="utf-8"><title>Amp Wiring</title>
<style>body{margin:0;background:#14161c}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="DejaVu Sans, sans-serif">
  <rect width="1000" height="760" fill="#14161c"/>
  <text x="500" y="44" fill="#fff" font-size="28" font-weight="bold" text-anchor="middle">ESP32 + OLED + MAX98357A + Speaker</text>
  <text x="500" y="76" fill="#a9b0bf" font-size="18" text-anchor="middle" direction="rtl">گرێدانا شاشێ و ئەمپلیفایەری و سپیکەری</text>

  <!-- ESP32 -->
  <rect x="390" y="130" width="220" height="440" rx="14" fill="#111" stroke="#888" stroke-width="2"/>
  <rect x="425" y="145" width="150" height="90" fill="#bbb"/>
  <text x="500" y="200" fill="#222" font-size="24" font-weight="bold" text-anchor="middle">ESP32</text>
  <rect x="475" y="545" width="50" height="25" fill="#ccc"/><text x="500" y="562" font-size="11" text-anchor="middle">USB</text>
  <!-- left pins (to OLED) -->
  <g font-size="15" fill="#ffd54f">
    <circle cx="390" cy="280" r="7"/><text x="404" y="285">3V3</text>
    <circle cx="390" cy="320" r="7"/><text x="404" y="325">GND</text>
    <circle cx="390" cy="360" r="7"/><text x="404" y="365">G22</text>
    <circle cx="390" cy="400" r="7"/><text x="404" y="405">G21</text>
  </g>
  <!-- right pins (to amp) -->
  <g font-size="15" fill="#ffd54f" text-anchor="end">
    <circle cx="610" cy="280" r="7"/><text x="596" y="285">VIN 5V</text>
    <circle cx="610" cy="320" r="7"/><text x="596" y="325">GND</text>
    <circle cx="610" cy="360" r="7"/><text x="596" y="365">G25</text>
    <circle cx="610" cy="400" r="7"/><text x="596" y="405">G26</text>
    <circle cx="610" cy="440" r="7"/><text x="596" y="445">G27</text>
  </g>

  <!-- OLED -->
  <rect x="40" y="230" width="230" height="200" rx="10" fill="#1565c0" stroke="#90caf9" stroke-width="2"/>
  <rect x="62" y="305" width="186" height="105" fill="#000"/>
  <rect x="62" y="305" width="186" height="26" fill="#fbc02d" opacity=".85"/>
  <g font-size="14" fill="#fff" text-anchor="middle">
    <text x="85" y="292">GND</text><text x="130" y="292">VCC</text><text x="175" y="292">SCL</text><text x="220" y="292">SDA</text>
  </g>
  <g fill="#ffd54f"><circle cx="85" cy="268" r="6"/><circle cx="130" cy="268" r="6"/><circle cx="175" cy="268" r="6"/><circle cx="220" cy="268" r="6"/></g>
  <text x="155" y="460" fill="#fff" font-size="16" text-anchor="middle">OLED 0.96"</text>

  <path d="M383 280 H330 V200 H130 V262" stroke="#e53935" stroke-width="4" fill="none"/>
  <path d="M383 320 H320 V190 H85 V262" stroke="#9e9e9e" stroke-width="4" fill="none"/>
  <path d="M383 360 H310 V180 H175 V262" stroke="#1e88e5" stroke-width="4" fill="none"/>
  <path d="M383 400 H300 V170 H220 V262" stroke="#fb8c00" stroke-width="4" fill="none"/>

  <!-- MAX98357A -->
  <rect x="720" y="240" width="200" height="250" rx="10" fill="#6a1b9a" stroke="#ce93d8" stroke-width="2"/>
  <text x="820" y="275" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">MAX98357A</text>
  <g font-size="14" fill="#fff">
    <text x="748" y="295">VIN</text><text x="748" y="325">GND</text><text x="748" y="355">LRC</text>
    <text x="748" y="385">BCLK</text><text x="748" y="415">DIN</text><text x="748" y="445" fill="#c9b3d6">GAIN ×</text><text x="748" y="475" fill="#c9b3d6">SD ×</text>
  </g>
  <g fill="#ffd54f">
    <circle cx="734" cy="290" r="6"/><circle cx="734" cy="320" r="6"/><circle cx="734" cy="350" r="6"/>
    <circle cx="734" cy="380" r="6"/><circle cx="734" cy="410" r="6"/><circle cx="734" cy="440" r="6" fill="#777"/><circle cx="734" cy="470" r="6" fill="#777"/>
  </g>
  <!-- screw terminal -->
  <rect x="870" y="320" width="45" height="80" rx="4" fill="#26a69a"/>
  <circle cx="892" cy="342" r="10" fill="#cfd8dc"/><circle cx="892" cy="378" r="10" fill="#cfd8dc"/>
  <text x="856" y="348" fill="#fff" font-size="18">+</text><text x="856" y="384" fill="#fff" font-size="18">−</text>

  <path d="M617 280 H680 V290 H728" stroke="#e53935" stroke-width="4" fill="none"/>
  <path d="M617 320 H728" stroke="#9e9e9e" stroke-width="4" fill="none"/>
  <path d="M617 360 H680 V350 H728" stroke="#43a047" stroke-width="4" fill="none"/>
  <path d="M617 400 H690 V380 H728" stroke="#ab47bc" stroke-width="4" fill="none"/>
  <path d="M617 440 H700 V410 H728" stroke="#fdd835" stroke-width="4" fill="none"/>

  <!-- speaker -->
  <circle cx="820" cy="630" r="70" fill="#9e9e9e" stroke="#cfd8dc" stroke-width="4"/>
  <circle cx="820" cy="630" r="34" fill="#bdbdbd"/>
  <text x="820" y="626" fill="#222" font-size="15" text-anchor="middle">8Ω</text>
  <text x="820" y="645" fill="#222" font-size="15" text-anchor="middle">0.5W</text>
  <path d="M892 342 H960 V600 H890" stroke="#1e88e5" stroke-width="4" fill="none"/>
  <path d="M892 378 H945 V585 H880" stroke="#fdd835" stroke-width="4" fill="none"/>

  <!-- warnings -->
  <g direction="rtl" font-size="17" fill="#ffca28" text-anchor="start">
    <text x="660" y="640">⚠ پینێن ئەمپلیفایەری دڤێت لحیم بکەی!</text>
    <text x="660" y="672" fill="#ddd">تەنێ دانانا تێلان ل ناڤ کونان کار ناکەت.</text>
    <text x="660" y="710" fill="#ddd">تێلێن سپیکەری ب پیچێن کەسک توند بکە.</text>
  </g>
</svg>
</body></html>
