<!doctype html>
<html><head><meta charset="utf-8"><title>Amp Burn Fix</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1500" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="34" font-weight="bold" fill="#c62828" text-anchor="middle" direction="rtl">ئەمپ سۆت؟ 🔥 ئەڤە بکە</text>

  <!-- step 1 -->
  <rect x="30" y="90" width="700" height="250" rx="22" fill="#fff" stroke="#ff3b30" stroke-width="4"/>
  <circle cx="680" cy="140" r="26" fill="#ff3b30"/><text x="680" y="151" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="150" font-size="26" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">نوکە باتریێ دەرێخە!</text>
  <text x="640" y="192" font-size="20" fill="#5d6878" direction="rtl" text-anchor="start">و کابلێ USB ژی</text>
  <rect x="70" y="135" width="150" height="90" rx="10" fill="#222"/><text x="145" y="190" font-size="22" fill="#fff" text-anchor="middle">باتری</text>
  <path d="M220 180 h60" stroke="#e53935" stroke-width="8"/>
  <path d="M290 160 l40 40 M330 160 l-40 40" stroke="#ff3b30" stroke-width="8"/>
  <path d="M340 180 h40" stroke="#e53935" stroke-width="8"/>
  <text x="145" y="290" font-size="20" fill="#c62828" font-weight="bold" text-anchor="middle">OFF ✗</text>

  <!-- step 2 -->
  <rect x="30" y="360" width="700" height="520" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="410" r="26" fill="#ff3b30"/><text x="680" y="421" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="420" font-size="26" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">تێلێن بلندگۆی</text>
  <!-- right way -->
  <text x="200" y="470" font-size="24" font-weight="bold" fill="#1e9e45" text-anchor="middle">✓ دروست</text>
  <rect x="70" y="490" width="260" height="110" rx="10" fill="#5e35b1"/>
  <rect x="140" y="510" width="120" height="60" rx="6" fill="#2e7d32"/>
  <circle cx="170" cy="540" r="16" fill="#1b5e20"/><circle cx="230" cy="540" r="16" fill="#1b5e20"/>
  <text x="170" y="592" font-size="20" fill="#fff" text-anchor="middle">+</text><text x="230" y="592" font-size="20" fill="#fff" text-anchor="middle">−</text>
  <path d="M170 600 C170 660 150 690 170 720" stroke="#fbc02d" stroke-width="7" fill="none"/>
  <path d="M230 600 C230 660 250 690 230 720" stroke="#1e88e5" stroke-width="7" fill="none"/>
  <circle cx="200" cy="770" r="55" fill="#222"/><circle cx="200" cy="770" r="20" fill="#555"/>
  <text x="200" y="855" font-size="18" fill="#333" text-anchor="middle" direction="rtl">ب تنێ بلندگۆ</text>
  <!-- wrong way -->
  <text x="540" y="470" font-size="24" font-weight="bold" fill="#c62828" text-anchor="middle">✗ خەلەت</text>
  <rect x="410" y="490" width="260" height="110" rx="10" fill="#5e35b1"/>
  <rect x="480" y="510" width="120" height="60" rx="6" fill="#2e7d32"/>
  <circle cx="510" cy="540" r="16" fill="#1b5e20"/><circle cx="570" cy="540" r="16" fill="#1b5e20"/>
  <text x="510" y="592" font-size="20" fill="#fff" text-anchor="middle">+</text><text x="570" y="592" font-size="20" fill="#fff" text-anchor="middle">−</text>
  <path d="M570 600 C570 650 620 680 640 700" stroke="#333" stroke-width="7" fill="none"/>
  <rect x="600" y="700" width="80" height="40" rx="6" fill="#333"/><text x="640" y="728" font-size="18" fill="#fff" text-anchor="middle">GND</text>
  <path d="M510 600 C520 650 540 650 560 640" stroke="#fbc02d" stroke-width="7" fill="none"/>
  <text x="470" y="690" font-size="34" text-anchor="middle">🔥</text>
  <text x="540" y="800" font-size="19" fill="#c62828" text-anchor="middle" direction="rtl">− نەدە GND</text>
  <text x="540" y="835" font-size="19" fill="#c62828" text-anchor="middle" direction="rtl">بلا + و − ب ئێک نەکەڤن</text>

  <!-- step 3 -->
  <rect x="30" y="900" width="700" height="440" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="950" r="26" fill="#14a3a8"/><text x="680" y="961" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="960" font-size="26" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">MT3608 ب Multimeter بپیڤە</text>
  <text x="640" y="1000" font-size="20" fill="#5d6878" direction="rtl" text-anchor="start">ئەمپ و ESP32 ژێ ڤەکە، پاشی بپیڤە</text>
  <rect x="70" y="1040" width="300" height="150" rx="12" fill="#1565c0"/>
  <text x="220" y="1100" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">MT3608</text>
  <rect x="95" y="1060" width="34" height="34" rx="4" fill="#fbc02d"/><circle cx="112" cy="1077" r="9" fill="#795548"/>
  <text x="135" y="1170" font-size="17" fill="#fff">VOUT+   VOUT−</text>
  <rect x="440" y="1040" width="230" height="200" rx="20" fill="#ffca28" stroke="#333" stroke-width="4"/>
  <rect x="465" y="1060" width="180" height="70" rx="6" fill="#cfd8dc"/>
  <text x="555" y="1110" font-size="38" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">5.0V</text>
  <text x="555" y="1200" font-size="18" fill="#333" text-anchor="middle">DC V</text>
  <text x="380" y="1280" font-size="22" fill="#1e9e45" font-weight="bold" text-anchor="middle" direction="rtl">دڤێت 5.0V بیت ✓</text>
  <text x="380" y="1318" font-size="20" fill="#c62828" text-anchor="middle" direction="rtl">ئەگەر پتر بوو (6V، 9V...) ئەمپ دسۆژیت: بورغیێ زەر بزڤڕینە</text>

  <!-- step 4 -->
  <rect x="30" y="1360" width="700" height="110" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1415" r="26" fill="#5d6878"/><text x="680" y="1426" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
  <text x="640" y="1425" font-size="24" fill="#1b1f24" direction="rtl" text-anchor="start">📸 وێنێ ئەمپێ ژ نێزیک بۆ من بهنێرە</text>
</svg>
</body></html>
