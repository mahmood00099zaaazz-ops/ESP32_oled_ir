<!doctype html><html><head><meta charset="utf-8"><title>Code To Laptop</title><style>body{margin:0;background:#f4f5f7}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1720" viewBox="0 0 760 1720" font-family="DejaVu Sans, sans-serif">
<rect width="760" height="1720" fill="#f4f5f7"/>
<text x="380" y="52" font-size="30" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">کۆدێ خالدی ← لاپتۆپ ← ESP32 🤖</text>
<!-- step 1 phone telegram -->
<rect x="20" y="75" width="720" height="330" rx="20" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="695" cy="120" r="26" fill="#ff1744"/><text x="695" y="131" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
<text x="655" y="130" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ل موبایلێ: فایلا khalid_one.ino</text>
<text x="655" y="165" font-size="21" fill="#5d6878" direction="rtl" text-anchor="start">ب Telegram بفرێکە بۆ Saved Messages</text>
<rect x="60" y="150" width="150" height="240" rx="20" fill="#1b1f24"/><rect x="70" y="170" width="130" height="200" rx="8" fill="#fff"/>
<rect x="80" y="190" width="110" height="60" rx="8" fill="#e3f2fd" stroke="#2979ff" stroke-width="3"/>
<text x="135" y="215" font-size="13" fill="#1b1f24" text-anchor="middle">📄 khalid_one</text><text x="135" y="235" font-size="13" fill="#1b1f24" text-anchor="middle">.ino</text>
<text x="135" y="300" font-size="40" text-anchor="middle">↗</text>
<path d="M230 270 L 360 270" stroke="#2aa3e0" stroke-width="6" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2aa3e0"/></marker></defs>
<circle cx="420" cy="270" r="50" fill="#2aa3e0"/><text x="420" y="290" font-size="50" fill="#fff" text-anchor="middle">✈</text>
<text x="420" y="355" font-size="18" fill="#1b1f24" text-anchor="middle">Saved Messages</text>
<!-- step 2 laptop telegram -->
<rect x="20" y="425" width="720" height="360" rx="20" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="695" cy="470" r="26" fill="#ff9100"/><text x="695" y="481" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
<text x="655" y="480" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ل لاپتۆپی Telegram ڤەکە ✈</text>
<text x="655" y="515" font-size="21" fill="#5d6878" direction="rtl" text-anchor="start">Saved Messages ← ل فایلێ بکە (دابەزینە)</text>
<rect x="60" y="545" width="420" height="210" rx="10" fill="#2b3040"/><rect x="72" y="557" width="396" height="170" fill="#fff"/>
<rect x="40" y="755" width="460" height="14" rx="6" fill="#555"/>
<rect x="90" y="575" width="140" height="140" fill="#e8f4fb"/><text x="160" y="610" font-size="14" fill="#1b1f24" text-anchor="middle">Saved</text><text x="160" y="630" font-size="14" fill="#1b1f24" text-anchor="middle">Messages</text>
<rect x="250" y="620" width="200" height="60" rx="10" fill="#e3f2fd" stroke="#ff9100" stroke-width="4"/>
<text x="350" y="650" font-size="15" fill="#1b1f24" text-anchor="middle">📄 khalid_one.ino</text><text x="350" y="670" font-size="13" fill="#2979ff" text-anchor="middle">⬇ download</text>
<text x="610" y="660" font-size="20" fill="#1b1f24" text-anchor="middle" direction="rtl">پاشی دوو جاران</text>
<text x="610" y="690" font-size="20" fill="#1b1f24" text-anchor="middle" direction="rtl">ل فایلێ بکە 🖱🖱</text>
<!-- step 3 arduino dialog -->
<rect x="20" y="805" width="720" height="330" rx="20" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="695" cy="850" r="26" fill="#00c853"/><text x="695" y="861" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
<text x="655" y="860" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">Arduino دێ پسیار کەت ← OK</text>
<text x="655" y="895" font-size="21" fill="#5d6878" direction="rtl" text-anchor="start">(فایلێ دێ بەتە د ناڤ فۆلدەرەکێ دا)</text>
<rect x="60" y="925" width="520" height="180" rx="10" fill="#fff" stroke="#888" stroke-width="2"/>
<text x="80" y="960" font-size="16" fill="#333">Moving</text>
<text x="80" y="990" font-size="14" fill="#555">The file "khalid_one.ino" needs to be inside a</text>
<text x="80" y="1010" font-size="14" fill="#555">sketch folder named "khalid_one".</text>
<text x="80" y="1030" font-size="14" fill="#555">Create this folder, move the file, and continue?</text>
<rect x="340" y="1050" width="100" height="40" rx="18" fill="#fff" stroke="#00979d" stroke-width="2"/><text x="390" y="1076" font-size="16" fill="#00979d" text-anchor="middle">CANCEL</text>
<rect x="455" y="1050" width="100" height="40" rx="18" fill="#00979d" stroke="#ff1744" stroke-width="5"/><text x="505" y="1076" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">OK</text>
<!-- step 4 upload -->
<rect x="20" y="1155" width="720" height="400" rx="20" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="695" cy="1200" r="26" fill="#2979ff"/><text x="695" y="1211" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
<text x="655" y="1210" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ESP32 Dev Module + COM5 ← ➡️ Upload</text>
<rect x="60" y="1250" width="640" height="70" fill="#00979d"/>
<circle cx="100" cy="1285" r="24" fill="#bff"/><circle cx="160" cy="1285" r="26" fill="#bff" stroke="#ff1744" stroke-width="6"/><text x="160" y="1295" font-size="26" fill="#00979d" text-anchor="middle">➜</text>
<rect x="210" y="1260" width="330" height="50" rx="6" fill="#fff"/><text x="225" y="1293" font-size="20" fill="#1b1f24">ESP32 Dev Module ▼</text>
<text x="160" y="1360" font-size="20" font-weight="bold" fill="#c62828" text-anchor="middle">Upload</text>
<text x="660" y="1400" font-size="20" fill="#1b1f24" direction="rtl" text-anchor="start">ئەگەر نەهاتبیتە هەلبژارتن: دیسان esp32 dev + COM5</text>
<rect x="60" y="1420" width="640" height="115" rx="8" fill="#111"/>
<text x="80" y="1452" font-size="17" fill="#ddd" font-family="DejaVu Sans Mono, monospace">Connecting.....  ← BOOT بگرە</text>
<text x="80" y="1480" font-size="17" fill="#ddd" font-family="DejaVu Sans Mono, monospace">Writing at 0x0001000 (100 %)</text>
<text x="80" y="1515" font-size="20" fill="#7ee08f" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Done uploading ✓ 🎉</text>
<text x="380" y="1600" font-size="22" fill="#5d6878" text-anchor="middle" direction="rtl">⏳ جارا ئێکێ ٢–٥ خولەک</text>
<text x="380" y="1660" font-size="26" font-weight="bold" fill="#1565c0" text-anchor="middle" direction="rtl">📸 پاشی وێنەکێ شاشێ بهنێرە</text>
</svg></body></html>
