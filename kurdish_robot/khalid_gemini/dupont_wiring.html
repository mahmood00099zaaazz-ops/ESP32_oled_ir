<!doctype html>
<html><head><meta charset="utf-8"><title>Dupont Wiring</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2060" viewBox="0 0 760 2060" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="2060" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">رۆبۆت بێ لحیم 🔌</text>
  <text x="380" y="96" font-size="20" fill="#5d6878" text-anchor="middle" direction="rtl">ب تێلێن Dupont: تنێ بکە سەر پینان</text>

  <!-- 1 buy -->
  <rect x="30" y="120" width="700" height="430" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="170" r="26" fill="#ff3b30"/><text x="680" y="181" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="180" font-size="25" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">🛒 ڤان بکڕە</text>
  <!-- esp32 -->
  <rect x="60" y="220" width="120" height="190" rx="8" fill="#1b1f24"/>
  <rect x="85" y="235" width="70" height="60" fill="#d6cfc0"/>
  <g stroke="#c0c0c0" stroke-width="4">
    <path d="M60 310 h-12 M60 335 h-12 M60 360 h-12 M60 385 h-12 M180 310 h12 M180 335 h12 M180 360 h12 M180 385 h12"/></g>
  <text x="120" y="440" font-size="17" fill="#333" text-anchor="middle">ESP32</text>
  <text x="120" y="462" font-size="15" fill="#5d6878" text-anchor="middle" direction="rtl">دگەل پینان</text>
  <!-- FF wires -->
  <g>
    <rect x="235" y="230" width="18" height="34" fill="#222"/><path d="M244 264 C244 330 300 330 300 390" stroke="#e53935" stroke-width="6" fill="none"/><rect x="291" y="390" width="18" height="34" fill="#222"/>
    <rect x="265" y="230" width="18" height="34" fill="#222"/><path d="M274 264 C274 330 330 330 330 390" stroke="#1e88e5" stroke-width="6" fill="none"/><rect x="321" y="390" width="18" height="34" fill="#222"/>
  </g>
  <text x="285" y="460" font-size="16" fill="#333" text-anchor="middle">Female-Female</text>
  <text x="285" y="482" font-size="15" fill="#5d6878" text-anchor="middle" direction="rtl">٢٠ تێل</text>
  <!-- MF wires -->
  <g>
    <rect x="385" y="230" width="18" height="34" fill="#222"/><path d="M394 264 C394 330 450 330 450 390" stroke="#fbc02d" stroke-width="6" fill="none"/><rect x="441" y="390" width="18" height="16" fill="#222"/><path d="M450 406 v20" stroke="#c0c0c0" stroke-width="4"/>
  </g>
  <text x="440" y="460" font-size="16" fill="#333" text-anchor="middle">Male-Female</text>
  <text x="440" y="482" font-size="15" fill="#5d6878" text-anchor="middle" direction="rtl">١٠ تێل</text>
  <!-- breadboard -->
  <rect x="520" y="230" width="170" height="190" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
  <path d="M535 245 v160" stroke="#e53935" stroke-width="3"/><path d="M675 245 v160" stroke="#1e88e5" stroke-width="3"/>
  <g fill="#999">
    <circle cx="550" cy="260" r="3"/><circle cx="550" cy="290" r="3"/><circle cx="550" cy="320" r="3"/><circle cx="550" cy="350" r="3"/><circle cx="550" cy="380" r="3"/>
    <circle cx="660" cy="260" r="3"/><circle cx="660" cy="290" r="3"/><circle cx="660" cy="320" r="3"/><circle cx="660" cy="350" r="3"/><circle cx="660" cy="380" r="3"/>
    <circle cx="590" cy="270" r="3"/><circle cx="620" cy="270" r="3"/><circle cx="590" cy="300" r="3"/><circle cx="620" cy="300" r="3"/><circle cx="590" cy="330" r="3"/><circle cx="620" cy="330" r="3"/></g>
  <text x="605" y="460" font-size="16" fill="#333" text-anchor="middle">Breadboard</text>
  <text x="605" y="482" font-size="15" fill="#5d6878" text-anchor="middle" direction="rtl">بچویک</text>
  <text x="380" y="525" font-size="18" fill="#c62828" text-anchor="middle" direction="rtl">💡 شاشە، مایک و ئەمپ ب پینێن لحیمکری ڤە بکڕە</text>

  <!-- 2 power rails -->
  <rect x="30" y="570" width="700" height="360" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="620" r="26" fill="#14a3a8"/><text x="680" y="631" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="630" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">کارەبێ بدە Breadboard</text>
  <text x="640" y="668" font-size="18" fill="#5d6878" direction="rtl" text-anchor="start">ESP32 تنێ ئێک 3V3 هەیە، Breadboard دابەش دکەت</text>
  <rect x="60" y="700" width="200" height="200" rx="10" fill="#1b1f24"/>
  <text x="160" y="790" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">ESP32</text>
  <text x="95" y="740" font-size="17" fill="#ffd54f" font-weight="bold">3V3</text>
  <text x="95" y="860" font-size="17" fill="#ffd54f" font-weight="bold">GND</text>
  <rect x="430" y="700" width="260" height="200" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
  <path d="M450 715 h220" stroke="#e53935" stroke-width="5"/><path d="M450 885 h220" stroke="#1e88e5" stroke-width="5"/>
  <g fill="#888"><circle cx="470" cy="735" r="4"/><circle cx="510" cy="735" r="4"/><circle cx="550" cy="735" r="4"/><circle cx="590" cy="735" r="4"/><circle cx="630" cy="735" r="4"/>
  <circle cx="470" cy="865" r="4"/><circle cx="510" cy="865" r="4"/><circle cx="550" cy="865" r="4"/><circle cx="590" cy="865" r="4"/><circle cx="630" cy="865" r="4"/></g>
  <path d="M260 735 C350 735 380 735 470 735" stroke="#e53935" stroke-width="7" fill="none"/>
  <path d="M260 865 C350 865 380 865 470 865" stroke="#222" stroke-width="7" fill="none"/>
  <text x="560" y="780" font-size="20" fill="#e53935" font-weight="bold" text-anchor="middle">+ 3V3 ریز</text>
  <text x="560" y="835" font-size="20" fill="#1e88e5" font-weight="bold" text-anchor="middle">− GND ریز</text>

  <!-- 3 OLED -->
  <rect x="30" y="950" width="700" height="300" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1000" r="26" fill="#1565c0"/><text x="680" y="1011" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="1010" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">شاشە 🖥️</text>
  <g font-size="21" font-family="DejaVu Sans Mono, monospace">
    <text x="80" y="1070" fill="#1b1f24">VCC  ──▶  + ریز (3V3)</text>
    <text x="80" y="1115" fill="#1b1f24">GND  ──▶  − ریز (GND)</text>
    <text x="80" y="1160" fill="#1b1f24">SCL  ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">22</tspan></text>
    <text x="80" y="1205" fill="#1b1f24">SDA  ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">21</tspan></text>
  </g>

  <!-- 4 mic -->
  <rect x="30" y="1270" width="700" height="380" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1320" r="26" fill="#263238"/><text x="680" y="1331" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
  <text x="640" y="1330" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">مایک INMP441 🎤</text>
  <g font-size="21" font-family="DejaVu Sans Mono, monospace">
    <text x="80" y="1390" fill="#1b1f24">VDD  ──▶  + ریز (3V3)</text>
    <text x="80" y="1435" fill="#1b1f24">GND  ──▶  − ریز (GND)</text>
    <text x="80" y="1480" fill="#1b1f24">L/R  ──▶  − ریز (GND)</text>
    <text x="80" y="1525" fill="#1b1f24">WS   ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">33</tspan></text>
    <text x="80" y="1570" fill="#1b1f24">SCK  ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">32</tspan></text>
    <text x="80" y="1615" fill="#1b1f24">SD   ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">35</tspan></text>
  </g>

  <!-- 5 amp -->
  <rect x="30" y="1670" width="700" height="360" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1720" r="26" fill="#5e35b1"/><text x="680" y="1731" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٥</text>
  <text x="640" y="1730" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ئەمپ MAX98357A 🔊</text>
  <g font-size="21" font-family="DejaVu Sans Mono, monospace">
    <text x="80" y="1790" fill="#1b1f24">VIN  ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">5V / VIN</tspan></text>
    <text x="80" y="1835" fill="#1b1f24">GND  ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">GND</tspan></text>
    <text x="80" y="1880" fill="#1b1f24">LRC  ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">25</tspan></text>
    <text x="80" y="1925" fill="#1b1f24">BCLK ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">26</tspan></text>
    <text x="80" y="1970" fill="#1b1f24">DIN  ──▶  ESP32 <tspan fill="#c62828" font-weight="bold">27</tspan></text>
  </g>
  <text x="380" y="2012" font-size="18" fill="#c62828" text-anchor="middle" direction="rtl">⚠️ VIN یا ئەمپێ نەدە + ریز (3V3)</text>
</svg>
</body></html>
