<!doctype html><html><head><meta charset="utf-8"><title>GitHub Way</title><style>body{margin:0;background:#f4f5f7}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1700" viewBox="0 0 760 1700" font-family="DejaVu Sans, sans-serif">
<rect width="760" height="1700" fill="#f4f5f7"/>
<text x="380" y="50" font-size="28" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">ڕێکا نوی — بێ پارچە ✂️ (ژ GitHub)</text>
<text x="380" y="88" font-size="19" fill="#c62828" text-anchor="middle" direction="rtl">کۆدا تە نوکە سەرێ وێ نینە (ڕێز ١–١١٠ چوون) ← دێ نوی کەین</text>

<text x="660" y="192" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">(لینک کورتە، Telegram ناکەتە پارچە)</text>
<rect x="50" y="215" width="660" height="120" rx="10" fill="#e8f4fb" stroke="#2aa3e0" stroke-width="3"/>
<text x="70" y="250" font-size="16" fill="#1565c0" font-family="DejaVu Sans Mono, monospace">https://raw.githubusercontent.com/</text>
<text x="70" y="275" font-size="16" fill="#1565c0" font-family="DejaVu Sans Mono, monospace">mahmood00099zaaazz-ops/ESP32_oled_ir/</text>
<text x="70" y="300" font-size="16" fill="#1565c0" font-family="DejaVu Sans Mono, monospace">ccr-72fb0ef7-brilio/kurdish_robot/</text>
<text x="70" y="325" font-size="16" fill="#1565c0" font-family="DejaVu Sans Mono, monospace">khalid_gemini/khalid_gemini.ino</text>
<!-- 2 -->
<rect x="20" y="375" width="720" height="300" rx="18" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="695" cy="415" r="24" fill="#ff9100"/><text x="695" y="425" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
<text x="660" y="425" font-size="22" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ل لاپتۆپی: Telegram ← ل لینکی بکە ← Chrome</text>
<rect x="50" y="450" width="660" height="200" rx="10" fill="#fff" stroke="#888" stroke-width="2"/>
<rect x="50" y="450" width="660" height="34" rx="10" fill="#e8eaed"/><text x="70" y="473" font-size="15" fill="#333">raw.githubusercontent.com/.../khalid_gemini.ino</text>
<g font-size="15" fill="#1b1f24" font-family="DejaVu Sans Mono, monospace">
<text x="70" y="510">// Khalid - a funny Kurdish (Badini) talking robot</text>
<text x="70" y="532">//</text><text x="70" y="554">// Hold BOOT and talk, release BOOT: ...</text>
<text x="70" y="576">...</text></g>
<text x="380" y="630" font-size="22" font-weight="bold" fill="#c62828" text-anchor="middle">Ctrl+A ← Ctrl+C</text>
<!-- 3 -->
<rect x="20" y="690" width="720" height="200" rx="18" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="695" cy="730" r="24" fill="#00c853"/><text x="695" y="740" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
<text x="660" y="740" font-size="22" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ل Arduino: ل ناڤ کۆدێ کلیک</text>

<text x="380" y="850" font-size="20" fill="#5d6878" text-anchor="middle" direction="rtl">ڕێزا دوماهیێ نێزیکی ٨١٠ ✓ (یەک جار، بێ پارچە)</text>
<!-- 4 -->
<rect x="20" y="905" width="720" height="560" rx="18" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="695" cy="945" r="24" fill="#2979ff"/><text x="695" y="955" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
<text x="660" y="955" font-size="22" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ڕێزا 24 بگوهۆڕە (کلیل + WiFi):</text>
<text x="660" y="990" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">ل GitHub کلیل نینە — ژ بۆ پاراستنێ 🔒</text>
<rect x="50" y="1010" width="660" height="70" rx="8" fill="#ffebee" stroke="#ff1744" stroke-width="3"/>
<text x="65" y="1053" font-size="18" fill="#c62828" font-family="DejaVu Sans Mono, monospace">24  #include "secrets.h"     ✗ ئەڤێ ژێببە</text>
<text x="380" y="1120" font-size="30" text-anchor="middle">⬇</text>
<rect x="50" y="1140" width="660" height="125" rx="8" fill="#e8f7ec" stroke="#00c853" stroke-width="3"/>
<g font-size="18" fill="#1b1f24" font-family="DejaVu Sans Mono, monospace">
<text x="65" y="1175">#define WIFI_NAME  "XALED"</text>
<text x="65" y="1207">#define WIFI_PASS  "11111111"</text>
<text x="65" y="1239">#define GEMINI_KEY "AIza.........."</text></g>
<text x="660" y="1310" font-size="19" fill="#1b1f24" direction="rtl" text-anchor="start">ئەڤ ٣ ڕێزە ژ پارچا ئێکێ یا Telegram کۆپی بکە</text>
<text x="660" y="1345" font-size="19" fill="#1b1f24" direction="rtl" text-anchor="start">(ل ڕێزا 22–24 ی وێ یێن هەین، کلیل ژی تێدایە)</text>
<text x="660" y="1395" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">ب تنێ ئەو ٣ ڕێز — ژ ئێک پەیامێ، بێ [دەم] ناڤ:</text>
<text x="660" y="1435" font-size="19" fill="#c62828" direction="rtl" text-anchor="start">⚠️ کلیل ب دروستی، د ناڤ " " دا</text>
<text x="380" y="1520" font-size="28" font-weight="bold" fill="#c62828" text-anchor="middle" direction="rtl">٥. ➡️ Upload</text>
<text x="380" y="1590" font-size="22" fill="#1565c0" font-weight="bold" text-anchor="middle" direction="rtl">📸 پاشی وێنەکێ بهنێرە</text>
