<!doctype html>
<html><head><meta charset="utf-8"><title>Hotspot Steps</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1640" viewBox="0 0 760 1640" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1640" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="34" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">بچە ڤێرێ: Hotspot یا موبایلێ 📱</text>
  <text x="380" y="98" font-size="21" fill="#5d6878" text-anchor="middle" direction="rtl">کۆد نەگوهۆڕە — ب تنێ موبایلێ ڕێک بێخە</text>

  <!-- step 1 -->
  <rect x="30" y="125" width="700" height="330" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="175" r="26" fill="#ff3b30"/><text x="680" y="186" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="185" font-size="25" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">⚙️ Settings ڤەکە</text>
  <text x="640" y="225" font-size="20" fill="#5d6878" direction="rtl" text-anchor="start">پاشی Connections</text>
  <rect x="60" y="160" width="330" height="270" rx="22" fill="#1b1f24"/>
  <rect x="75" y="180" width="300" height="230" rx="10" fill="#fff"/>
  <text x="95" y="215" font-size="20" font-weight="bold" fill="#1b1f24">Settings</text>
  <text x="95" y="260" font-size="18" fill="#333">📶 Wi-Fi</text>
  <rect x="85" y="280" width="280" height="44" rx="8" fill="#e8f7ec" stroke="#34c759" stroke-width="4"/>
  <text x="95" y="309" font-size="18" font-weight="bold" fill="#1b1f24">🔗 Connections</text>
  <text x="95" y="360" font-size="18" fill="#333">🔔 Sounds</text>
  <text x="95" y="395" font-size="18" fill="#333">🔋 Battery</text>

  <!-- step 2 -->
  <rect x="30" y="475" width="700" height="300" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="525" r="26" fill="#ff3b30"/><text x="680" y="536" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="535" font-size="25" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">Hotspot بکە</text>
  <text x="640" y="575" font-size="20" fill="#5d6878" direction="rtl" text-anchor="start">Mobile Hotspot</text>
  <rect x="60" y="505" width="330" height="245" rx="22" fill="#1b1f24"/>
  <rect x="75" y="525" width="300" height="205" rx="10" fill="#fff"/>
  <text x="95" y="565" font-size="18" fill="#333">Wi-Fi</text>
  <text x="95" y="605" font-size="18" fill="#333">Bluetooth</text>
  <rect x="85" y="625" width="280" height="44" rx="8" fill="#e8f7ec" stroke="#34c759" stroke-width="4"/>
  <text x="95" y="654" font-size="18" font-weight="bold" fill="#1b1f24">📡 Mobile Hotspot</text>
  <text x="95" y="705" font-size="18" fill="#333">Data usage</text>

  <!-- step 3 -->
  <rect x="30" y="795" width="700" height="420" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="845" r="26" fill="#14a3a8"/><text x="680" y="856" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="855" font-size="25" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ڤان ب دروستی بنڤیسە</text>
  <rect x="60" y="890" width="640" height="300" rx="16" fill="#2b3040"/>
  <g font-size="22">
    <text x="85" y="940" fill="#cfd6e4">Network name</text>
    <rect x="400" y="910" width="280" height="46" rx="8" fill="none" stroke="#34c759" stroke-width="4"/>
    <text x="420" y="942" fill="#ffd54f" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Khalid</text>
    <text x="85" y="1010" fill="#cfd6e4">Password</text>
    <rect x="400" y="980" width="280" height="46" rx="8" fill="none" stroke="#34c759" stroke-width="4"/>
    <text x="420" y="1012" fill="#ffd54f" font-weight="bold" font-family="DejaVu Sans Mono, monospace">11111111</text>
    <text x="85" y="1080" fill="#cfd6e4">Band</text>
    <rect x="400" y="1050" width="280" height="46" rx="8" fill="none" stroke="#34c759" stroke-width="4"/>
    <text x="420" y="1082" fill="#7ee08f" font-weight="bold">2.4 GHz ✓</text>
    <text x="85" y="1150" fill="#cfd6e4">Security</text>
    <text x="420" y="1150" fill="#fff">WPA2</text>
  </g>

  <!-- step 4 -->
  <rect x="30" y="1235" width="700" height="370" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1285" r="26" fill="#34c759"/><text x="680" y="1296" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
  <text x="640" y="1295" font-size="25" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">Hotspot بکە ON</text>
  <text x="640" y="1335" font-size="20" fill="#5d6878" direction="rtl" text-anchor="start">پاشی ل ESP32 دوگما EN بکە</text>
  <text x="640" y="1375" font-size="20" fill="#1e9e45" direction="rtl" text-anchor="start">شاشە دێ بێژیت press BOOT ✓</text>
  <!-- toggle -->
  <rect x="70" y="1290" width="110" height="56" rx="28" fill="#34c759"/>
  <circle cx="152" cy="1318" r="22" fill="#fff"/>
  <text x="200" y="1328" font-size="24" font-weight="bold" fill="#1e9e45">ON</text>
  <!-- esp32 -->
  <rect x="70" y="1395" width="160" height="200" rx="10" fill="#1b1f24"/>
  <rect x="105" y="1410" width="90" height="60" fill="#bbb"/><text x="150" y="1447" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">ESP32</text>
  <rect x="90" y="1530" width="36" height="26" rx="4" fill="#ddd"/><text x="108" y="1584" font-size="14" fill="#fff" text-anchor="middle">EN</text>
  <circle cx="108" cy="1543" r="28" fill="none" stroke="#ff3b30" stroke-width="5"/>
  <rect x="175" y="1530" width="36" height="26" rx="4" fill="#ddd"/><text x="193" y="1584" font-size="14" fill="#fff" text-anchor="middle">BOOT</text>
  <!-- oled -->
  <rect x="270" y="1430" width="200" height="110" rx="10" fill="#000"/>
  <rect x="305" y="1455" width="40" height="40" rx="10" fill="#7fdcff"/><rect x="395" y="1455" width="40" height="40" rx="10" fill="#7fdcff"/>
  <text x="370" y="1525" font-size="17" font-weight="bold" fill="#7fdcff" text-anchor="middle">press BOOT ✓</text>
  <text x="600" y="1500" font-size="54" text-anchor="middle">🤖</text>
</svg>
</body></html>
