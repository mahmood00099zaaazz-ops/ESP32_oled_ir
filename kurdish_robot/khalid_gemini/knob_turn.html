<!doctype html>
<html><head><meta charset="utf-8"><title>Knob Turn</title><style>body{margin:0;background:#f4f5f7}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1240" viewBox="0 0 760 1240" font-family="DejaVu Sans, sans-serif">
<rect width="760" height="1240" fill="#f4f5f7"/>
<text x="380" y="52" font-size="30" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">دوگما سپی بۆ کیش لایێ بزڤڕینم؟ 🪛</text>
<!-- big knob -->
<rect x="30" y="80" width="700" height="620" rx="24" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<rect x="210" y="160" width="340" height="340" rx="30" fill="#1e88e5"/>
<circle cx="380" cy="330" r="130" fill="#f5f5f5" stroke="#bbb" stroke-width="6"/>
<rect x="362" y="230" width="36" height="200" rx="6" fill="#333"/>
<!-- clockwise arrow right -->
<path d="M420 150 A190 190 0 0 1 560 420" stroke="#1e9e45" stroke-width="16" fill="none"/>
<path d="M530 410 l35 30 l20 -45" stroke="#1e9e45" stroke-width="16" fill="none" stroke-linejoin="round"/>
<text x="640" y="250" font-size="64" text-anchor="middle">🔊</text>
<text x="640" y="320" font-size="28" font-weight="bold" fill="#1e9e45" text-anchor="middle">↻ راست</text>
<text x="640" y="355" font-size="20" fill="#1e9e45" text-anchor="middle" direction="rtl">بلندتر</text>
<!-- ccw arrow left -->
<path d="M340 510 A190 190 0 0 1 200 240" stroke="#c62828" stroke-width="10" fill="none" stroke-dasharray="18 10"/>
<path d="M225 255 l-28 -32 l-18 42" stroke="#c62828" stroke-width="10" fill="none"/>
<text x="110" y="420" font-size="54" text-anchor="middle">🔉</text>
<text x="110" y="480" font-size="26" font-weight="bold" fill="#c62828" text-anchor="middle">↺ چەپ</text>
<text x="110" y="512" font-size="19" fill="#c62828" text-anchor="middle" direction="rtl">کێمتر</text>
<!-- screwdriver -->
<path d="M380 330 L380 120" stroke="#9e9e9e" stroke-width="12"/>
<rect x="358" y="70" width="44" height="70" rx="12" fill="#e53935"/>
<text x="380" y="600" font-size="22" fill="#1b1f24" text-anchor="middle" direction="rtl">دەرنەڤیسا بچویک بکە د کونا ناڤەراستێ دا</text>
<text x="380" y="640" font-size="20" fill="#5d6878" text-anchor="middle" direction="rtl">وەکی دەمژمێرێ 🕐 ↻ = دەنگ بلند دبیت</text>
<!-- steps -->
<rect x="30" y="720" width="700" height="490" rx="24" fill="#fff" stroke="#34c759" stroke-width="4"/>
<g font-size="23" direction="rtl" text-anchor="start" fill="#1b1f24">
<text x="700" y="775" font-weight="bold">١. 🪛 دەرنەڤیس ← د کونا سپی دا</text>
<text x="700" y="830" font-weight="bold" fill="#1e9e45">٢. ↻ هێدی بۆ راستێ بزڤڕینە</text>
<text x="700" y="885" font-weight="bold">٣. 🔄 EN پال بدە ← گوهـ بدە بیپان 🔊🔊</text>
<text x="700" y="950" fill="#5d6878">💡 دەنگ کێمتر بوو؟ ← بۆ چەپێ ↺ بزڤڕینە</text>
<text x="700" y="1000" fill="#5d6878">(ل هندەک بۆردان ئاراستە بەرەڤاژی یە)</text>
<text x="700" y="1065" fill="#c62828">⚠️ تنێ نیڤ دۆر دزڤڕیت، ب زۆری نەزڤڕینە</text>
<text x="700" y="1115" fill="#c62828">⚠️ خشەخش هات؟ هندەکێ ↺ بزڤڕینە</text>
<text x="700" y="1170" fill="#5d6878">📸 ئەگەر دەنگ نەهات، وێنێ ESP32 بهنێرە</text>
</g>
</svg></body></html>
