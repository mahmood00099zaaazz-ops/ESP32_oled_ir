<!doctype html><html><head><meta charset="utf-8"><title>Laptop Setup</title><style>body{margin:0;background:#f4f5f7}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2620" viewBox="0 0 760 2620" font-family="DejaVu Sans, sans-serif">
<rect width="760" height="2620" fill="#f4f5f7"/>
<text x="380" y="50" font-size="30" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">لاپتۆپ ئامادە بکە 💻 (ئێک جار)</text>
<text x="380" y="86" font-size="18" fill="#5d6878" text-anchor="middle" direction="rtl">پێدڤی ب ئینتەرنێتێ هەیە (١٥–٣٠ خولەک)</text>

<!-- 1 -->
<rect x="30" y="110" width="700" height="300" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="160" r="26" fill="#ff3b30"/><text x="680" y="171" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
<text x="640" y="170" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">Arduino IDE دابەزینە و Install بکە</text>
<rect x="70" y="210" width="620" height="170" rx="12" fill="#e0f2f1" stroke="#00979c" stroke-width="2"/>
<rect x="70" y="210" width="620" height="40" rx="12" fill="#00979c"/>
<text x="90" y="237" font-size="18" fill="#fff" font-family="DejaVu Sans Mono, monospace">arduino.cc/en/software</text>
<circle cx="140" cy="315" r="38" fill="#00979c"/><text x="140" y="328" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">∞</text>
<text x="200" y="300" font-size="22" font-weight="bold" fill="#00979c">Arduino IDE 2</text>
<rect x="200" y="315" width="230" height="44" rx="8" fill="#00979c"/><text x="315" y="344" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Windows Win 10+ ⬇️</text>
<text x="670" y="350" font-size="17" fill="#5d6878" direction="rtl" text-anchor="start">Next ← Next ← Install</text>

<!-- 2 preferences -->
<rect x="30" y="430" width="700" height="370" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="480" r="26" fill="#14a3a8"/><text x="680" y="491" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
<text x="640" y="490" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">File ← Preferences ← ئەڤ لینکە Paste بکە</text>
<rect x="70" y="530" width="620" height="240" rx="10" fill="#fff" stroke="#bbb" stroke-width="2"/>
<rect x="70" y="530" width="620" height="36" fill="#eceff1"/><text x="90" y="555" font-size="16" fill="#333">Preferences</text>
<text x="90" y="600" font-size="15" fill="#333">Additional boards manager URLs:</text>
<rect x="90" y="612" width="580" height="40" rx="5" fill="#fff" stroke="#00979c" stroke-width="3"/>
<text x="100" y="638" font-size="12.5" fill="#1b1f24" font-family="DejaVu Sans Mono, monospace">https://espressif.github.io/arduino-esp32/package_esp32_index.json</text>
<rect x="560" y="715" width="110" height="38" rx="6" fill="#00979c"/><text x="615" y="740" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">OK</text>
<text x="90" y="700" font-size="15" fill="#5d6878" direction="ltr">(Ctrl + ,)</text>

<!-- 3 boards -->
<rect x="30" y="820" width="700" height="300" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="870" r="26" fill="#1e88e5"/><text x="680" y="881" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
<text x="640" y="880" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ESP32 زێدە بکە (Boards Manager)</text>
<rect x="70" y="920" width="620" height="170" rx="10" fill="#fff" stroke="#bbb" stroke-width="2"/>
<rect x="70" y="920" width="60" height="170" fill="#eceff1"/>
<rect x="82" y="940" width="36" height="30" rx="4" fill="#00979c"/><text x="100" y="990" font-size="11" fill="#333" text-anchor="middle">Boards</text>
<rect x="150" y="935" width="300" height="32" rx="6" fill="#fff" stroke="#999"/><text x="162" y="957" font-size="16" fill="#333">esp32</text>
<text x="150" y="1010" font-size="17" font-weight="bold" fill="#1b1f24">esp32 by Espressif Systems</text>
<rect x="520" y="1035" width="140" height="36" rx="6" fill="#00979c"/><text x="590" y="1059" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">INSTALL</text>
<circle cx="590" cy="1053" r="44" fill="none" stroke="#ff3b30" stroke-width="5"/>
<text x="150" y="1060" font-size="15" fill="#5d6878">⏳ ~10 min</text>

<!-- 4 library -->
<rect x="30" y="1140" width="700" height="300" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="1190" r="26" fill="#5e35b1"/><text x="680" y="1201" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
<text x="640" y="1200" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">کتێبخانا U8g2 (Library Manager)</text>
<rect x="70" y="1240" width="620" height="170" rx="10" fill="#fff" stroke="#bbb" stroke-width="2"/>
<rect x="70" y="1240" width="60" height="170" fill="#eceff1"/>
<rect x="82" y="1260" width="36" height="30" rx="4" fill="#5e35b1"/><text x="100" y="1310" font-size="11" fill="#333" text-anchor="middle">Library</text>
<rect x="150" y="1255" width="300" height="32" rx="6" fill="#fff" stroke="#999"/><text x="162" y="1277" font-size="16" fill="#333">U8g2</text>
<text x="150" y="1330" font-size="17" font-weight="bold" fill="#1b1f24">U8g2 by oliver</text>
<rect x="520" y="1355" width="140" height="36" rx="6" fill="#5e35b1"/><text x="590" y="1379" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">INSTALL</text>
<text x="150" y="1380" font-size="15" fill="#1e9e45">✓ only this one</text>

<!-- 5 plug + board/port -->
<rect x="30" y="1460" width="700" height="380" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="1510" r="26" fill="#fb8c00"/><text x="680" y="1521" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٥</text>
<text x="640" y="1520" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ESP32 ب USB ← Board و Port</text>
<rect x="70" y="1560" width="620" height="180" rx="10" fill="#fff" stroke="#bbb" stroke-width="2"/>
<rect x="70" y="1560" width="620" height="40" fill="#263238"/>
<rect x="130" y="1568" width="300" height="26" rx="5" fill="#455a64"/><text x="142" y="1587" font-size="15" fill="#fff">Select Board ▼</text>
<text x="100" y="1640" font-size="17" font-weight="bold" fill="#1b1f24">Board: ESP32 Dev Module ✓</text>
<text x="100" y="1680" font-size="17" font-weight="bold" fill="#1b1f24">Port:  COM3 (USB) ✓</text>
<text x="100" y="1720" font-size="15" fill="#5d6878">Tools → Upload Speed → 115200</text>
<g direction="rtl" text-anchor="start" font-size="17">
<text x="690" y="1775" fill="#c62828">✗ چ COM نینە؟ ← درایڤەر: CP210x یان CH340 / CH343</text>
<text x="690" y="1810" fill="#5d6878">(ل سەر چیپا USB یا نێزیکی USB-C بخوینە)</text>
</g>

<!-- 6 upload -->
<rect x="30" y="1860" width="700" height="410" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="1910" r="26" fill="#34c759"/><text x="680" y="1921" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٦</text>
<text x="640" y="1920" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">کۆدێ خالدی Paste ← ✓ ← ➡️</text>
<rect x="70" y="1960" width="620" height="44" fill="#00979c"/>
<circle cx="100" cy="1982" r="15" fill="#fff"/><path d="M93 1982 l6 6 l10 -12" stroke="#00979c" stroke-width="4" fill="none"/>
<circle cx="140" cy="1982" r="15" fill="#fff"/><path d="M132 1982 h14 M140 1975 l7 7 l-7 7" stroke="#00979c" stroke-width="4" fill="none"/>
<circle cx="140" cy="1982" r="25" fill="none" stroke="#ff3b30" stroke-width="5"/>
<text x="180" y="1989" font-size="15" fill="#fff">✓ Verify   ➡️ Upload</text>
<rect x="70" y="2020" width="620" height="110" rx="8" fill="#0b0b0b"/>
<g font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#9be59b"><text x="90" y="2052">Writing at 0x000e0000... (100 %)</text><text x="90" y="2080">Hard resetting via RTS pin...</text><text x="90" y="2112" fill="#fff" font-weight="bold">Done uploading ✓</text></g>
<g direction="rtl" text-anchor="start" font-size="18">
<text x="690" y="2175" fill="#1b1f24">Ctrl+A ← Delete ← Ctrl+V (کۆدێ ژ WhatsApp)</text>
<text x="690" y="2215" fill="#c62828">Connecting..... ← دوگما IO0 بگرە هەتا دەستپێدکەت</text>
<text x="690" y="2250" fill="#5d6878">Save؟ ← ناڤەکی بدە: khalid</text>
</g>

<rect x="30" y="2290" width="700" height="300" rx="22" fill="#e8f5e9" stroke="#1e9e45" stroke-width="3"/>
<g direction="rtl" text-anchor="start" font-size="21">
<text x="700" y="2340" font-weight="bold" fill="#1e9e45">🎉 پاشی:</text>
<text x="700" y="2385" fill="#1b1f24">١. USB ژ لاپتۆپی دەرێخە</text>
<text x="700" y="2425" fill="#1b1f24">٢. تێلێن شاشێ، مایکێ، ئەمپێ گرێ بدە</text>
<text x="700" y="2465" fill="#1b1f24">٣. USB یا شاحنێ یان باتری ← EN</text>
<text x="700" y="2505" fill="#1b1f24">٤. ٢ بیپ 🔊 ← Silav! Ez Xalid im 😊</text>
<text x="700" y="2555" fill="#1565c0" font-weight="bold">📸 وێنێ لاپتۆپی بۆ من بهنێرە ئەگەر ئاریشە هەبوو</text>
</g>
</svg></body></html>
