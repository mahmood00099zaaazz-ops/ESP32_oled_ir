<!doctype html>
<html><head><meta charset="utf-8"><title>MT3608 Adjust</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1640" viewBox="0 0 760 1640" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1640" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">MT3608 بکە 5.0V 🔧</text>

  <!-- 1 -->
  <rect x="30" y="90" width="700" height="330" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="140" r="26" fill="#ff3b30"/><text x="680" y="151" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="150" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ب تنێ باتری + TP4056 + MT3608</text>
  <text x="640" y="188" font-size="19" fill="#c62828" direction="rtl" text-anchor="start">ESP32 و ئەمپ گرێ نەدە ✗</text>
  <rect x="60" y="230" width="130" height="90" rx="10" fill="#222"/><text x="125" y="282" font-size="18" fill="#fff" text-anchor="middle">باتری</text>
  <rect x="240" y="225" width="150" height="100" rx="8" fill="#1565c0"/><text x="315" y="282" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">TP4056</text>
  <rect x="440" y="215" width="250" height="120" rx="8" fill="#1565c0"/><text x="580" y="285" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">MT3608</text>
  <rect x="460" y="235" width="40" height="40" rx="4" fill="#1e88e5" stroke="#fff" stroke-width="2"/><circle cx="480" cy="255" r="10" fill="#fff"/><path d="M473 255 h14" stroke="#555" stroke-width="3"/>
  <path d="M190 260 H240" stroke="#e53935" stroke-width="6"/><path d="M190 300 H240" stroke="#222" stroke-width="6"/>
  <path d="M390 245 H440" stroke="#e53935" stroke-width="6"/><path d="M390 305 H440" stroke="#222" stroke-width="6"/>
  <text x="380" y="385" font-size="19" fill="#5d6878" text-anchor="middle" direction="rtl">سویچ ON بکە</text>

  <!-- 2 multimeter -->
  <rect x="30" y="440" width="700" height="520" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="490" r="26" fill="#14a3a8"/><text x="680" y="501" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="500" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">Multimeter ← DC V 20</text>
  <!-- meter -->
  <rect x="70" y="540" width="240" height="380" rx="24" fill="#ffca28" stroke="#333" stroke-width="4"/>
  <rect x="95" y="565" width="190" height="80" rx="6" fill="#cfd8dc"/>
  <text x="190" y="622" font-size="40" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">5.00</text>
  <circle cx="190" cy="750" r="70" fill="#444"/><path d="M190 750 L240 700" stroke="#fff" stroke-width="8"/>
  <text x="250" y="690" font-size="16" font-weight="bold" fill="#c62828">20</text>
  <text x="120" y="690" font-size="15" fill="#333">V⎓</text>
  <circle cx="140" cy="880" r="14" fill="#222"/><circle cx="240" cy="880" r="14" fill="#e53935"/>
  <text x="140" y="912" font-size="14" fill="#333" text-anchor="middle">COM</text><text x="240" y="912" font-size="14" fill="#333" text-anchor="middle">V</text>
  <!-- board -->
  <rect x="430" y="600" width="260" height="140" rx="8" fill="#1565c0"/>
  <text x="560" y="660" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">MT3608</text>
  <g font-size="15" font-weight="bold" fill="#ffd54f"><text x="445" y="728">VOUT+</text><text x="610" y="728">VOUT−</text></g>
  <path d="M240 880 C330 880 400 820 470 740" stroke="#e53935" stroke-width="6" fill="none"/>
  <path d="M140 880 C150 950 600 940 640 740" stroke="#222" stroke-width="6" fill="none"/>
  <text x="560" y="560" font-size="18" fill="#e53935" font-weight="bold" text-anchor="middle" direction="rtl">سۆر ← VOUT+</text>
  <text x="560" y="588" font-size="18" fill="#222" font-weight="bold" text-anchor="middle" direction="rtl">رەش ← VOUT−</text>

  <!-- 3 turn -->
  <rect x="30" y="980" width="700" height="440" rx="22" fill="#fff" stroke="#34c759" stroke-width="4"/>
  <circle cx="680" cy="1030" r="26" fill="#34c759"/><text x="680" y="1041" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="1040" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">بورغیێ شین هێدی بزڤڕینە 🪛</text>
  <text x="640" y="1078" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">هەتا ل Multimeter بێژیت 5.0</text>
  <!-- pot big -->
  <rect x="90" y="1110" width="160" height="160" rx="12" fill="#1e88e5" stroke="#0d47a1" stroke-width="4"/>
  <circle cx="170" cy="1190" r="50" fill="#fff"/><path d="M135 1190 h70" stroke="#555" stroke-width="10"/>
  <path d="M270 1150 A90 90 0 0 1 270 1230" stroke="#e53935" stroke-width="6" fill="none"/>
  <path d="M262 1222 l8 12 l12 -8" stroke="#e53935" stroke-width="6" fill="none"/>
  <!-- screwdriver -->
  <path d="M205 1190 L330 1310" stroke="#9e9e9e" stroke-width="10"/>
  <path d="M330 1310 L380 1360" stroke="#e53935" stroke-width="28" stroke-linecap="round"/>
  <g font-size="20" direction="rtl" text-anchor="start">
    <text x="690" y="1150" fill="#c62828" font-weight="bold">پتر ژ 5 ← بزڤڕینە لایێ دی</text>
    <text x="690" y="1190" fill="#1565c0" font-weight="bold">کێمتر ژ 5 ← بزڤڕینە ئەڤ لایە</text>
    <text x="690" y="1240" fill="#1b1f24">💡 دبیت ١٠–٢٠ جاران بزڤڕینی</text>
    <text x="690" y="1272" fill="#1b1f24">هەتا ژمارە بگوهۆڕیت</text>
    <text x="690" y="1330" fill="#1e9e45" font-weight="bold">✓ 4.9 – 5.1 = باشە</text>
    <text x="690" y="1368" fill="#c62828" font-weight="bold">✗ پتر ژ 5.5 = ئەمپ دسۆژیت</text>
  </g>

  <!-- 4 -->
  <rect x="30" y="1440" width="700" height="170" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1490" r="26" fill="#5d6878"/><text x="680" y="1501" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
  <text x="640" y="1500" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">سویچ OFF ← پاشی ESP32 گرێ بدە</text>
  <text x="640" y="1545" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">VOUT+ ← 5V ، VOUT− ← GND</text>
  <text x="640" y="1580" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">📸 وێنێ Multimeter بۆ من بهنێرە</text>
</svg>
</body></html>
