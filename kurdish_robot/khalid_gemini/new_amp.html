<!doctype html>
<html><head><meta charset="utf-8"><title>New Amp Steps</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1700" viewBox="0 0 760 1700" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1700" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">ئەمپا نوو: ئەڤە بکە 🔊</text>

  <!-- 1 buy -->
  <rect x="30" y="90" width="700" height="250" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="140" r="26" fill="#ff3b30"/><text x="680" y="151" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="150" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">🛒 بکڕە: MAX98357A</text>
  <text x="640" y="190" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">پارچا سەوز بهێلە ل ناڤ کیسکی ✗</text>
  <rect x="70" y="140" width="220" height="160" rx="10" fill="#5e35b1"/>
  <rect x="150" y="195" width="60" height="50" rx="4" fill="#222"/>
  <circle cx="220" cy="280" r="9" fill="#cfa040"/><circle cx="260" cy="280" r="9" fill="#cfa040"/>
  <rect x="330" y="230" width="90" height="50" rx="6" fill="#2e7d32"/>
  <path d="M320 220 l110 70 M430 220 l-110 70" stroke="#ff3b30" stroke-width="7"/>

  <!-- 2 wire through hole -->
  <rect x="30" y="360" width="700" height="400" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="410" r="26" fill="#14a3a8"/><text x="680" y="421" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="420" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">تێلێ بکە د کونێ دا ↓</text>
  <text x="640" y="460" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">ژ سەری، هەتا ژ پشتێ دەرکەڤیت</text>
  <rect x="90" y="500" width="440" height="140" rx="10" fill="#5e35b1"/>
  <text x="190" y="580" font-size="22" fill="#fff" text-anchor="middle" direction="rtl">ئەمپ</text>
  <circle cx="360" cy="570" r="16" fill="#cfa040"/><circle cx="460" cy="570" r="16" fill="#cfa040"/>
  <text x="330" y="610" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="490" y="610" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <path d="M360 470 V555" stroke="#fbc02d" stroke-width="9"/><path d="M360 555 V665" stroke="#d4884a" stroke-width="5"/>
  <path d="M460 470 V555" stroke="#1e88e5" stroke-width="9"/><path d="M460 555 V665" stroke="#d4884a" stroke-width="5"/>
  <text x="300" y="490" font-size="19" fill="#c79100" font-weight="bold" text-anchor="middle">زەر</text>
  <text x="520" y="490" font-size="19" fill="#1565c0" font-weight="bold" text-anchor="middle">شین</text>
  <text x="410" y="720" font-size="19" fill="#d4884a" text-anchor="middle" direction="rtl">مسێ سۆر ژ پشتێ دیار دبیت</text>

  <!-- 3 solder back -->
  <rect x="30" y="780" width="700" height="430" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="830" r="26" fill="#34c759"/><text x="680" y="841" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="840" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ل پشتێ لحیم بکە 🔥</text>
  <text x="640" y="880" font-size="19" fill="#c62828" direction="rtl" text-anchor="start">⏱️ تنێ ٢-٣ چرکە</text>
  <rect x="90" y="920" width="440" height="140" rx="10" fill="#4527a0"/>
  <text x="190" y="1000" font-size="20" fill="#fff" text-anchor="middle" direction="rtl">پشتا ئەمپێ</text>
  <circle cx="360" cy="990" r="18" fill="#d0d0d0"/><circle cx="460" cy="990" r="18" fill="#d0d0d0"/>
  <!-- iron -->
  <path d="M345 1000 L280 1030" stroke="#9e9e9e" stroke-width="6"/><path d="M280 1030 L215 1060" stroke="#1565c0" stroke-width="20" stroke-linecap="round"/>
  <!-- gap -->
  <path d="M385 1040 h50" stroke="#34c759" stroke-width="4"/>
  <path d="M385 1030 v20 M435 1030 v20" stroke="#34c759" stroke-width="4"/>
  <text x="410" y="1100" font-size="20" fill="#1e9e45" font-weight="bold" text-anchor="middle" direction="rtl">ڤالاتی ✓ (+ و − ب ئێک نەکەڤن)</text>
  <!-- wrong blob small -->
  <rect x="560" y="930" width="140" height="110" rx="8" fill="#4527a0"/>
  <ellipse cx="630" cy="985" rx="50" ry="22" fill="#d0d0d0"/>
  <path d="M570 940 l120 90 M690 940 l-120 90" stroke="#ff3b30" stroke-width="6"/>
  <text x="630" y="1070" font-size="17" fill="#c62828" text-anchor="middle" direction="rtl">✗ لحیم ب ئێک گرتی</text>
  <text x="380" y="1160" font-size="19" fill="#5d6878" text-anchor="middle" direction="rtl">مسێ زێدە ب مەقەسێ ببڕە ✂️</text>

  <!-- 4 connect -->
  <rect x="30" y="1230" width="700" height="440" rx="22" fill="#fff" stroke="#34c759" stroke-width="4"/>
  <circle cx="680" cy="1280" r="26" fill="#5d6878"/><text x="680" y="1291" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
  <text x="640" y="1290" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ب ESP32 ڤە گرێ بدە (USB)</text>
  <rect x="90" y="1320" width="580" height="90" rx="10" fill="#7b1f1f"/>
  <text x="140" y="1372" font-size="22" font-weight="bold" fill="#fff">ESP32</text>
  <g font-size="18" font-weight="bold" fill="#ffd54f" text-anchor="middle">
    <text x="300" y="1395">VIN</text><text x="380" y="1395">GND</text><text x="460" y="1395">25</text><text x="540" y="1395">26</text><text x="620" y="1395">27</text>
  </g>
  <path d="M300 1410 V1500" stroke="#e53935" stroke-width="6"/><path d="M380 1410 V1500" stroke="#555" stroke-width="6"/>
  <path d="M460 1410 V1500" stroke="#fb8c00" stroke-width="6"/><path d="M540 1410 V1500" stroke="#1e88e5" stroke-width="6"/><path d="M620 1410 V1500" stroke="#43a047" stroke-width="6"/>
  <rect x="90" y="1500" width="580" height="90" rx="10" fill="#5e35b1"/>
  <text x="140" y="1552" font-size="22" font-weight="bold" fill="#fff">ئەمپ</text>
  <g font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="300" y="1528">VIN</text><text x="380" y="1528">GND</text><text x="460" y="1528">LRC</text><text x="540" y="1528">BCLK</text><text x="620" y="1528">DIN</text>
  </g>
  <text x="380" y="1640" font-size="20" fill="#1e9e45" font-weight="bold" text-anchor="middle" direction="rtl">پاشی USB بکە و Upload بکە ✓</text>
</svg>
</body></html>
