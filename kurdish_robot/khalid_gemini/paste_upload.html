<!doctype html><html><head><meta charset="utf-8"><title>Paste And Upload</title><style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 2000 2500" font-family="DejaVu Sans, sans-serif">
<rect width="2000" height="2500" fill="#fff"/>
<clipPath id="c"><rect x="0" y="0" width="2000" height="800"/></clipPath>
<image href="real/laptop_installing.jpg" x="0" y="20" width="2000" height="1125" clip-path="url(#c)"/>
<g font-weight="bold" text-anchor="middle">
<!-- select board (588,62) -->
<rect x="435" y="35" width="310" height="65" rx="8" fill="none" stroke="#ff1744" stroke-width="9"/>
<circle cx="800" cy="68" r="40" fill="#ff1744"/><text x="800" y="84" font-size="46" fill="#fff">1</text>
<!-- code area -->
<rect x="650" y="120" width="1150" height="390" rx="10" fill="none" stroke="#2979ff" stroke-width="9"/>
<circle cx="1700" cy="200" r="40" fill="#2979ff"/><text x="1700" y="216" font-size="46" fill="#fff">2</text>
<!-- upload arrow (358,60) -->
<circle cx="358" cy="60" r="44" fill="none" stroke="#00e676" stroke-width="10"/>
<circle cx="358" cy="170" r="40" fill="#00c853"/><text x="358" y="186" font-size="46" fill="#fff">3</text>
</g>
<rect x="0" y="800" width="2000" height="1700" fill="#f4f5f7"/>
<g direction="rtl" text-anchor="start">
<text x="1940" y="910" font-size="62" font-weight="bold" fill="#ff1744">١. Select Board ← Select other board and port</text>
<text x="1940" y="990" font-size="54" fill="#1b1f24">esp32 dev ← ESP32 Dev Module (یان ESP32 Dev Board)</text>
<text x="1940" y="1065" font-size="54" fill="#1b1f24">ڕاست: COM5 ← OK</text>
<text x="1940" y="1190" font-size="62" font-weight="bold" fill="#2962ff">٢. کۆدێ خالدی ل جهێ کۆدا کەڤن دانە:</text>
<text x="1940" y="1270" font-size="52" fill="#1b1f24">a. ل لاپتۆپی claude.ai ڤەکە ← ڤێ گفتوگۆیێ ڤەکە</text>
<text x="1940" y="1345" font-size="52" fill="#1b1f24">b. فایلا khalid_one.ino ڤەکە ← Ctrl+A ← Ctrl+C</text>
<text x="1940" y="1420" font-size="52" fill="#1b1f24">c. ل Arduino ل ناڤ کۆدێ بکە (یا شین)</text>
<text x="1940" y="1495" font-size="52" fill="#1b1f24">d. Ctrl+A ← Delete ← Ctrl+V</text>
<text x="1940" y="1620" font-size="62" font-weight="bold" fill="#00a046">٣. ل ➡️ Upload بکە (یا کەسک)</text>
<text x="1940" y="1700" font-size="52" fill="#1b1f24">⏳ ٢–٥ خولەک (جارا ئێکێ درێژە)</text>
<text x="1940" y="1780" font-size="52" fill="#1b1f24">"Connecting....." دیت؟ ← دوگما BOOT ل ESP32 بگرە</text>
<text x="1940" y="1910" font-size="62" font-weight="bold" fill="#1e9e45">✓ "Done uploading" = خالد ئامادەیە! 🤖</text>
<text x="1940" y="2030" font-size="50" fill="#c62828">⚠️ کۆد کلیلا Gemini تێدایە — نەدە کەسێ</text>
<text x="1940" y="2150" font-size="56" fill="#1565c0" font-weight="bold">📸 خەلەتی (پیتێن سۆر)؟ وێنەکێ بهنێرە</text>
</g>
</svg></body></html>
