<!doctype html><html><head><meta charset="utf-8"><title>Preferences Steps</title><style>body{margin:0;background:#f4f5f7}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1900" viewBox="0 0 760 1900" font-family="DejaVu Sans, sans-serif">
<rect width="760" height="1900" fill="#f4f5f7"/>
<text x="380" y="50" font-size="30" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">گاڤا ٢: لینکا ESP32 ل لاپتۆپی 💻</text>

<rect x="70" y="180" width="620" height="310" rx="8" fill="#fff" stroke="#bbb" stroke-width="2"/>
<rect x="70" y="180" width="620" height="34" fill="#eceff1"/>
<g font-size="16" fill="#333"><text x="85" y="203" font-weight="bold">File</text><text x="140" y="203">Edit</text><text x="195" y="203">Sketch</text><text x="265" y="203">Tools</text><text x="325" y="203">Help</text></g>
<rect x="76" y="183" width="50" height="28" rx="4" fill="none" stroke="#ff3b30" stroke-width="4"/>
<rect x="76" y="214" width="300" height="260" fill="#fff" stroke="#999"/>
<g font-size="16" fill="#333"><text x="92" y="243">New Sketch</text><text x="92" y="273">Open...</text><text x="92" y="303">Save</text><text x="92" y="333">...</text></g>
<rect x="80" y="350" width="292" height="34" fill="#e0f2f1"/>

<rect x="80" y="350" width="292" height="34" fill="none" stroke="#00e676" stroke-width="4"/>
<text x="92" y="420" font-size="16" fill="#333">Quit</text>
<text x="530" y="380" font-size="18" fill="#5d6878" text-anchor="middle" direction="rtl">یان Ctrl + ,</text>

<!-- B: preferences window -->
<rect x="30" y="540" width="700" height="560" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="590" r="26" fill="#14a3a8"/><text x="680" y="601" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">ب</text>
<text x="640" y="600" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ل خوارێ: Additional boards manager URLs</text>
<rect x="70" y="640" width="620" height="430" rx="8" fill="#fff" stroke="#bbb" stroke-width="2"/>
<rect x="70" y="640" width="620" height="34" fill="#eceff1"/><text x="90" y="663" font-size="16" fill="#333">Preferences</text>
<g font-size="15" fill="#777"><text x="90" y="710">Sketchbook location: ...</text><text x="90" y="745">Editor font size: 14</text><text x="90" y="780">Interface scale: 100%</text><text x="90" y="815">Language: English</text><text x="90" y="850">Show verbose output: ☐ compile ☐ upload</text></g>
<text x="90" y="905" font-size="16" font-weight="bold" fill="#1b1f24">Additional boards manager URLs:</text>
<rect x="90" y="920" width="520" height="40" rx="5" fill="#fff" stroke="#00e676" stroke-width="4"/>
<text x="100" y="946" font-size="14" fill="#999">👆 ل ڤێرێ کلیک بکە ← Ctrl+V</text>
<rect x="618" y="920" width="44" height="40" rx="5" fill="#eceff1" stroke="#999"/><text x="640" y="947" font-size="18" text-anchor="middle">⧉</text>

<rect x="555" y="1010" width="110" height="40" rx="6" fill="#00979c"/><text x="610" y="1036" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">OK</text>

<!-- C: link -->
<rect x="30" y="1120" width="700" height="330" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
<circle cx="680" cy="1170" r="26" fill="#fb8c00"/><text x="680" y="1181" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">ج</text>
<text x="640" y="1180" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ئەڤێ لینکێ Paste بکە</text>
<rect x="60" y="1215" width="640" height="70" rx="10" fill="#0b0b0b"/>
<text x="75" y="1258" font-size="13.4" fill="#9be59b" font-family="DejaVu Sans Mono, monospace">https://espressif.github.io/arduino-esp32/package_esp32_index.json</text>
<g direction="rtl" text-anchor="start" font-size="19" fill="#1b1f24">
<text x="690" y="1330">💡 لینکێ ژ ڤێ چاتێ Copy بکە و ب WhatsApp بۆ لاپتۆپی بهنێرە</text>
<text x="690" y="1370">(WhatsApp Web ل لاپتۆپی ڤەکە)</text>
<text x="690" y="1415" fill="#c62828">⚠️ حەرف ب حەرف، بێ ڤالاتی ل سەری و دوماهیێ</text>
</g>

<!-- D: OK -->
<rect x="30" y="1470" width="700" height="400" rx="22" fill="#fff" stroke="#34c759" stroke-width="4"/>
<circle cx="680" cy="1520" r="26" fill="#34c759"/><text x="680" y="1531" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">د</text>
<text x="640" y="1530" font-size="23" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">OK بکە ← ل خوارێ چاڤەرێ بە</text>
<rect x="70" y="1570" width="620" height="90" rx="8" fill="#0b0b0b"/>
<text x="90" y="1608" font-size="15" fill="#9be59b" font-family="DejaVu Sans Mono, monospace">Downloading index: package_esp32_index.json</text>
<text x="90" y="1640" font-size="15" fill="#fff" font-family="DejaVu Sans Mono, monospace">Done ✓</text>
<g direction="rtl" text-anchor="start" font-size="20">
<text x="690" y="1710" fill="#1e9e45" font-weight="bold">✓ پاشی بچە گاڤا ٣: Boards Manager ← esp32</text>
<text x="690" y="1760" fill="#5d6878">💡 ئەگەر esp32 بێ لینک ژی دیار بوو، باشە ✓</text>
<text x="690" y="1810" fill="#5d6878">📸 وێنێ شاشا لاپتۆپی بهنێرە ئەگەر ئاریشە هەبوو</text>
</g>
