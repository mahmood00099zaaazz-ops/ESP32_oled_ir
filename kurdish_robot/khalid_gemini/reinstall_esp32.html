<!doctype html><html><head><meta charset="utf-8"><title>Reinstall ESP32</title><style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1300" viewBox="0 0 1125 1925" font-family="DejaVu Sans, sans-serif">
<rect width="1125" height="1925" fill="#fff"/>
<clipPath id="c"><rect x="0" y="0" width="1125" height="800"/></clipPath>
<image href="real/laptop_nodevmod.jpg" x="0" y="-460" width="1125" height="2000" clip-path="url(#c)"/>
<g font-weight="bold" text-anchor="middle">
<!-- grey list y 790-1030 -> 330-570 -->
<rect x="180" y="320" width="420" height="260" rx="10" fill="none" stroke="#ff9100" stroke-width="8" stroke-dasharray="14 8"/>
<rect x="190" y="590" width="470" height="70" rx="12" fill="#e65100"/>
<text x="425" y="637" font-size="30" fill="#fff" direction="rtl">✗ ESP32 Dev Module نینە!</text>
<!-- cancel (885,1122-460=662) -->
<rect x="815" y="630" width="140" height="65" rx="30" fill="none" stroke="#ff1744" stroke-width="9"/>
<circle cx="885" cy="740" r="36" fill="#ff1744"/><text x="885" y="755" font-size="40" fill="#fff">1</text>
</g>
<rect x="0" y="800" width="1125" height="1125" fill="#f4f5f7"/>
<g direction="rtl" text-anchor="start">
<text x="1090" y="885" font-size="36" font-weight="bold" fill="#e65100">ESP32 ژ لاپتۆپی هاتیە ژێبرن (uninstalled)</text>
<text x="1090" y="940" font-size="32" fill="#5d6878">نە گونەها تەیە 🙂 — دێ دیسان دانین</text>
<text x="1090" y="1040" font-size="40" font-weight="bold" fill="#1b1f24">١. ل CANCEL بکە</text>
<text x="1090" y="1120" font-size="40" font-weight="bold" fill="#1b1f24">٢. ل چەپێ ئایکۆنا دووێ 🔲 (Boards)</text>
<text x="1090" y="1200" font-size="40" font-weight="bold" fill="#1b1f24">٣. بنڤیسە: esp32</text>
<text x="1090" y="1280" font-size="40" font-weight="bold" fill="#1b1f24">٤. esp32 by Espressif Systems ← INSTALL</text>
<text x="1090" y="1360" font-size="40" font-weight="bold" fill="#1b1f24">٥. ⏳ چاڤەرێ بە هەتا "installed" دیار دبیت</text>
<text x="1090" y="1470" font-size="40" font-weight="bold" fill="#c62828">⚠️ پاشی ب چ REMOVE نەکە!</text>
<text x="1090" y="1540" font-size="32" fill="#5d6878">(REMOVE = ژێبرن)</text>
<text x="1090" y="1640" font-size="36" fill="#1b1f24">٦. پاشی دیسان: Select Board ← Select other...</text>
<text x="1090" y="1700" font-size="36" fill="#1b1f24">    esp32 dev ← ESP32 Dev Module + COM5 ← OK</text>
<text x="1090" y="1810" font-size="38" fill="#1565c0" font-weight="bold">📸 پاشی وێنەکێ بهنێرە</text>
</g>
