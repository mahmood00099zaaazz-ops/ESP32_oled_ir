<!doctype html><html><head><meta charset="utf-8"><title>Send Errors</title><style>body{margin:0;background:#f4f5f7}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1180" viewBox="0 0 760 1180" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1180" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">ئێرۆران نیشا من بدە 📸</text>
  <text x="380" y="98" font-size="22" fill="#5d6878" text-anchor="middle" direction="rtl">من نەشێم شاشا تە ببینم، لەوما وێنەی بهنێرە</text>

  <!-- step 1: diagnostics tab -->
  <g transform="translate(40,130)">
    <rect width="680" height="330" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
    <rect x="20" y="20" width="440" height="290" rx="14" fill="#000"/>
    <g font-size="21" text-anchor="middle"><text x="140" y="65" fill="#fff" font-weight="bold">DIAGNOSTICS</text><text x="350" y="65" fill="#aaa">OUTPUT</text></g>
    <rect x="45" y="30" width="190" height="52" rx="10" fill="none" stroke="#ff3b30" stroke-width="6"/>
    <rect x="45" y="80" width="190" height="4" fill="#14a3a8"/>
    <g font-size="19" fill="#ddd">
      <circle cx="50" cy="130" r="11" fill="#e53935"/><text x="72" y="137">310  21  no matching ...</text>
      <circle cx="50" cy="180" r="11" fill="#e53935"/><text x="72" y="187">352  3   cannot initialize ...</text>
      <circle cx="50" cy="230" r="11" fill="#e53935"/><text x="72" y="237">...</text>
    </g>
    <circle cx="610" cy="70" r="30" fill="#ff3b30"/><text x="610" y="82" font-size="32" fill="#fff" font-weight="bold" text-anchor="middle">١</text>
    <g direction="rtl" text-anchor="start">
      <text x="660" y="160" font-size="19" fill="#1b1f24" font-weight="bold">DIAGNOSTICS بکە</text>
      <text x="660" y="200" font-size="20" fill="#5d6878">ل خوارێ شاشێ</text>
    </g>
  </g>

  <!-- step 2: screenshot buttons -->
  <g transform="translate(40,490)">
    <rect width="680" height="330" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
    <rect x="150" y="30" width="170" height="270" rx="26" fill="#1b1f24"/>
    <rect x="162" y="48" width="146" height="234" rx="12" fill="#3a4250"/>
    <rect x="320" y="80" width="12" height="44" rx="4" fill="#ff3b30"/>
    <rect x="320" y="150" width="12" height="70" rx="4" fill="#ff3b30"/>
    <text x="345" y="110" font-size="18" fill="#ff3b30" font-weight="bold">POWER</text>
    <text x="345" y="192" font-size="18" fill="#ff3b30" font-weight="bold">VOL −</text>
    <text x="235" y="175" font-size="40" fill="#fff" text-anchor="middle">📸</text>
    <circle cx="610" cy="70" r="30" fill="#ff3b30"/><text x="610" y="82" font-size="32" fill="#fff" font-weight="bold" text-anchor="middle">٢</text>
    <g direction="rtl" text-anchor="start">
      <text x="660" y="160" font-size="24" fill="#1b1f24" font-weight="bold">وێنەکێ بگرە</text>
      <text x="660" y="200" font-size="20" fill="#5d6878">پاوەر + دەنگ − پێکڤە</text>
    </g>
  </g>

  <!-- step 3 -->
  <g transform="translate(40,850)">
    <rect width="680" height="280" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
    <circle cx="610" cy="70" r="30" fill="#34c759"/><text x="610" y="82" font-size="32" fill="#fff" font-weight="bold" text-anchor="middle">٣</text>
    <g direction="rtl" text-anchor="start">
      <text x="560" y="80" font-size="25" fill="#1b1f24" font-weight="bold">وێنەی ل ڤێرێ بۆ من بهنێرە</text>
      <text x="560" y="130" font-size="21" fill="#5d6878">ب دوگما ➕ ل خوارێ چاتێ</text>
      <text x="560" y="190" font-size="21" fill="#5d6878">ئەگەر ئێرۆر گەلەک بن، لیستێ ببە خوارێ</text>
      <text x="560" y="225" font-size="21" fill="#5d6878">و وێنەکێ دی ژی بگرە</text>
    </g>
  </g>
</svg></body></html>
