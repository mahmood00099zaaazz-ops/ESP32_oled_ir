<!doctype html>
<html><head><meta charset="utf-8"><title>Find The Short</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1720" viewBox="0 0 760 1720" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1720" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#c62828" text-anchor="middle" direction="rtl">گەرم دبیت + گڵۆپ کێمە = شۆرت 🔥</text>

  <!-- 1 -->
  <rect x="30" y="90" width="700" height="200" rx="22" fill="#fff" stroke="#ff3b30" stroke-width="4"/>
  <circle cx="680" cy="140" r="26" fill="#ff3b30"/><text x="680" y="151" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="150" font-size="25" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">USB یەکسەر دەرێخە!</text>
  <text x="640" y="190" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">و باتری ژی. هەتا دبیتە سار</text>
  <rect x="80" y="140" width="70" height="110" rx="10" fill="#eee" stroke="#999" stroke-width="3"/>
  <rect x="100" y="110" width="30" height="35" rx="4" fill="#bbb"/>
  <path d="M175 160 l50 50 M225 160 l-50 50" stroke="#ff3b30" stroke-width="8"/>

  <!-- 2 loose wires -->
  <rect x="30" y="310" width="700" height="260" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="360" r="26" fill="#ff3b30"/><text x="680" y="371" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="370" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">تێلێن زیڤی یێن رووت لابە</text>
  <text x="640" y="410" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">پارچێن لحیمێ / تێلێن بێ پلاستیک</text>
  <text x="640" y="440" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">ئەگەر ب پینەکێ بکەڤن = شۆرت</text>
  <rect x="80" y="400" width="200" height="130" rx="8" fill="#1b1f24"/>
  <g fill="#bbb"><circle cx="100" cy="420" r="7"/><circle cx="100" cy="450" r="7"/><circle cx="100" cy="480" r="7"/><circle cx="100" cy="510" r="7"/>
  <circle cx="260" cy="420" r="7"/><circle cx="260" cy="450" r="7"/><circle cx="260" cy="480" r="7"/><circle cx="260" cy="510" r="7"/></g>
  <path d="M60 445 C120 470 150 380 300 470 C330 490 340 520 360 510" stroke="#9e9e9e" stroke-width="5" fill="none"/>
  <text x="300" y="545" font-size="26">⚡</text>
  <path d="M330 480 l40 40 M370 480 l-40 40" stroke="#ff3b30" stroke-width="7"/>

  <!-- 3 bridges -->
  <rect x="30" y="590" width="700" height="290" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="640" r="26" fill="#14a3a8"/><text x="680" y="651" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="650" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">لحیم ل ناڤبەرا ٢ پینان؟</text>
  <text x="640" y="690" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">بەتایبەتی 3V3 و 5V و GND</text>
  <!-- good -->
  <text x="160" y="720" font-size="20" fill="#1e9e45" font-weight="bold" text-anchor="middle">✓</text>
  <rect x="90" y="735" width="140" height="70" rx="6" fill="#1b1f24"/>
  <circle cx="120" cy="770" r="13" fill="#d0d0d0"/><circle cx="160" cy="770" r="13" fill="#d0d0d0"/><circle cx="200" cy="770" r="13" fill="#d0d0d0"/>
  <text x="160" y="840" font-size="18" fill="#1e9e45" text-anchor="middle" direction="rtl">ڤالاتی</text>
  <!-- bad -->
  <text x="400" y="720" font-size="20" fill="#c62828" font-weight="bold" text-anchor="middle">✗</text>
  <rect x="330" y="735" width="140" height="70" rx="6" fill="#1b1f24"/>
  <ellipse cx="380" cy="770" rx="35" ry="16" fill="#d0d0d0"/><circle cx="440" cy="770" r="13" fill="#d0d0d0"/>
  <text x="400" y="840" font-size="18" fill="#c62828" text-anchor="middle" direction="rtl">ب ئێک گرتی</text>
  <text x="600" y="780" font-size="18" fill="#5d6878" text-anchor="middle" direction="rtl">هەویا گەرم</text>
  <text x="600" y="808" font-size="18" fill="#5d6878" text-anchor="middle" direction="rtl">د ناڤبەرێ دا بکێشە</text>

  <!-- 4 ESP32 alone -->
  <rect x="30" y="900" width="700" height="440" rx="22" fill="#fff" stroke="#34c759" stroke-width="4"/>
  <circle cx="680" cy="950" r="26" fill="#34c759"/><text x="680" y="961" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
  <text x="640" y="960" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ESP32 ب تنێ تاقی بکە</text>
  <text x="640" y="1000" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">تێلێن سۆر یێن 3V3 و 5V ژێ ڤەکە ✂️</text>
  <text x="640" y="1030" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">پاشی ب تنێ USB بکە</text>
  <rect x="300" y="1060" width="150" height="230" rx="10" fill="#1b1f24"/>
  <rect x="330" y="1080" width="90" height="80" rx="4" fill="#d6cfc0"/>
  <circle cx="345" cy="1220" r="9" fill="#ff1744"/>
  <rect x="345" y="1270" width="60" height="40" rx="4" fill="#ccc"/>
  <path d="M270 1100 h30 M270 1160 h30" stroke="#e53935" stroke-width="6"/>
  <path d="M250 1090 l20 20 M270 1090 l-20 20 M250 1150 l20 20 M270 1150 l-20 20" stroke="#ff3b30" stroke-width="5"/>
  <text x="225" y="1110" font-size="17" fill="#e53935" text-anchor="end">3V3</text>
  <text x="225" y="1170" font-size="17" fill="#e53935" text-anchor="end">5V</text>
  <!-- results -->
  <g direction="rtl" text-anchor="start" font-size="19">
    <text x="690" y="1110" fill="#1e9e45" font-weight="bold">🔴 گەش + سار</text>
    <text x="690" y="1140" fill="#1e9e45">= ESP32 باشە ✓</text>
    <text x="690" y="1170" fill="#1e9e45">شۆرت د تێلان دا بوو</text>
    <text x="690" y="1225" fill="#c62828" font-weight="bold">🔴 کێم + گەرم</text>
    <text x="690" y="1255" fill="#c62828">= ESP32 خراب بوویە ✗</text>
    <text x="690" y="1285" fill="#c62828">ESP32 یا نوو بکڕە</text>
  </g>

  <!-- 5 add one by one -->
  <rect x="30" y="1360" width="700" height="330" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1410" r="26" fill="#5d6878"/><text x="680" y="1421" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٥</text>
  <text x="640" y="1420" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">پارچان ئێک ب ئێک زێدە بکە</text>
  <text x="640" y="1460" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">پشتی هەر ئێکێ: USB بکە و ١٠ چرکە دەست بدێ</text>
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="480" y="1500" width="170" height="80" rx="12" fill="#1565c0"/><text x="565" y="1548" fill="#fff">شاشە</text>
    <text x="445" y="1550" fill="#333">←</text>
    <rect x="270" y="1500" width="150" height="80" rx="12" fill="#263238"/><text x="345" y="1548" fill="#fff">مایک</text>
    <text x="240" y="1550" fill="#333">←</text>
    <rect x="70" y="1500" width="150" height="80" rx="12" fill="#5e35b1"/><text x="145" y="1548" fill="#fff">ئەمپ</text>
  </g>
  <text x="380" y="1640" font-size="20" fill="#c62828" text-anchor="middle" direction="rtl">کیژ پارچە گەرم کر ← شۆرت ل وێرێ یە 🔍</text>
</svg>
</body></html>
