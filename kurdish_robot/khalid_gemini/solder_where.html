<!doctype html>
<html><head><meta charset="utf-8"><title>Where To Solder</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1480" viewBox="0 0 760 1480" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1480" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">لحیم ل کیڤە بکەی؟ 🔥</text>

  <!-- wrong -->
  <rect x="30" y="90" width="700" height="380" rx="22" fill="#fff" stroke="#ff3b30" stroke-width="4"/>
  <circle cx="680" cy="140" r="26" fill="#ff3b30"/><text x="680" y="152" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">✗</text>
  <text x="640" y="150" font-size="24" font-weight="bold" fill="#c62828" direction="rtl" text-anchor="start">لحیم ل سەر پارچا سەوز نا!</text>
  <text x="640" y="190" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">پلاستیک دحەلیت و تێل ناگەهیتە ئەمپێ</text>
  <rect x="90" y="220" width="240" height="140" rx="8" fill="#2e7d32"/>
  <circle cx="150" cy="260" r="22" fill="#9e9e9e"/><circle cx="270" cy="260" r="22" fill="#9e9e9e"/>
  <rect x="130" y="305" width="40" height="30" fill="#111"/><rect x="250" y="305" width="40" height="30" fill="#111"/>
  <ellipse cx="270" cy="320" rx="45" ry="30" fill="#4e342e" opacity="0.9"/>
  <path d="M150 400 V335" stroke="#fbc02d" stroke-width="9"/><path d="M270 400 V340" stroke="#1e88e5" stroke-width="9"/>
  <!-- iron -->
  <path d="M330 260 L420 300" stroke="#9e9e9e" stroke-width="10"/><path d="M420 300 L520 345" stroke="#1565c0" stroke-width="26" stroke-linecap="round"/>
  <path d="M300 250 L330 260" stroke="#bbb" stroke-width="5"/>
  <text x="300" y="300" font-size="34">🔥</text>
  <text x="380" y="440" font-size="21" fill="#c62828" font-weight="bold" text-anchor="middle" direction="rtl">ئەڤە یا تە کری ← حەلیا ✗</text>

  <!-- right A: screw -->
  <rect x="30" y="490" width="700" height="420" rx="22" fill="#fff" stroke="#34c759" stroke-width="4"/>
  <circle cx="680" cy="540" r="26" fill="#34c759"/><text x="680" y="551" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="550" font-size="24" font-weight="bold" fill="#1e9e45" direction="rtl" text-anchor="start">تێل ← ب بورغیێ، بێ لحیم</text>
  <rect x="90" y="610" width="240" height="140" rx="8" fill="#2e7d32"/>
  <circle cx="150" cy="650" r="22" fill="#9e9e9e"/><path d="M135 650 h30" stroke="#333" stroke-width="5"/>
  <circle cx="270" cy="650" r="22" fill="#9e9e9e"/><path d="M255 650 h30" stroke="#333" stroke-width="5"/>
  <rect x="130" y="700" width="40" height="30" fill="#111"/><rect x="250" y="700" width="40" height="30" fill="#111"/>
  <path d="M150 820 V740" stroke="#fbc02d" stroke-width="9"/><path d="M150 740 V710" stroke="#d4884a" stroke-width="5"/>
  <path d="M270 820 V740" stroke="#1e88e5" stroke-width="9"/><path d="M270 740 V710" stroke="#d4884a" stroke-width="5"/>
  <!-- screwdriver -->
  <path d="M270 650 L340 720" stroke="#9e9e9e" stroke-width="6"/><path d="M340 720 L390 770" stroke="#e53935" stroke-width="20" stroke-linecap="round"/>
  <text x="150" y="860" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">+</text>
  <text x="270" y="860" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">−</text>
  <g font-size="21" direction="rtl" text-anchor="start" fill="#1b1f24">
    <text x="640" y="650">مسێ تێلێ بکە د کونا رەش دا</text>
    <text x="640" y="700">بورغیێ ب دەرنەڤیسێ قایم بکە</text>
    <text x="640" y="750" fill="#1e9e45">هەویا لحیمێ پێدڤی نینە ✓</text>
  </g>

  <!-- right B: solder pins under board -->
  <rect x="30" y="930" width="700" height="520" rx="22" fill="#fff" stroke="#34c759" stroke-width="4"/>
  <circle cx="680" cy="980" r="26" fill="#34c759"/><text x="680" y="991" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="990" font-size="24" font-weight="bold" fill="#1e9e45" direction="rtl" text-anchor="start">لحیم ← ل پشتا ئەمپێ (بنفشی)</text>
  <text x="640" y="1030" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">ئەمپێ بزڤڕینە، لحیمێ بکە د کونێن + و − دا</text>
  <rect x="140" y="1070" width="480" height="170" rx="10" fill="#5e35b1"/>
  <text x="250" y="1165" font-size="22" fill="#fff" text-anchor="middle" direction="rtl">پشتا ئەمپێ</text>
  <circle cx="440" cy="1160" r="20" fill="#d0d0d0"/><circle cx="540" cy="1160" r="20" fill="#d0d0d0"/>
  <circle cx="440" cy="1160" r="34" fill="none" stroke="#34c759" stroke-width="5"/>
  <circle cx="540" cy="1160" r="34" fill="none" stroke="#34c759" stroke-width="5"/>
  <text x="440" y="1110" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="540" y="1110" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <path d="M440 1160 C440 1300 410 1310 420 1340" stroke="#fbc02d" stroke-width="8" fill="none"/>
  <path d="M540 1160 C540 1300 520 1310 500 1340" stroke="#1e88e5" stroke-width="8" fill="none"/>
  <circle cx="460" cy="1370" r="40" fill="#222"/><circle cx="460" cy="1370" r="14" fill="#555"/>
  <text x="250" y="1370" font-size="20" fill="#333" text-anchor="middle" direction="rtl">بلندگۆ</text>
  <text x="380" y="1430" font-size="20" fill="#c62828" text-anchor="middle" direction="rtl">⏱️ هەویا لحیمێ تنێ ٢-٣ چرکە، پاشی رابکە</text>
</svg>
</body></html>
