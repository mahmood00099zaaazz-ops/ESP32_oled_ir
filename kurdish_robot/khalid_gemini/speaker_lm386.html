<!doctype html>
<html><head><meta charset="utf-8"><title>Speaker to LM386</title>
<style>body{margin:0;background:#fff}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1560" viewBox="0 0 1125 2310" font-family="DejaVu Sans, sans-serif">
  <rect width="1125" height="2310" fill="#fff"/>
  <text x="562" y="70" font-size="50" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">بلندگۆ ← LM386 🔊</text>
  <g transform="translate(0,100)">
    <image href="real/p_spk_lm.jpg" x="0" y="0" width="1125" height="2000"/>
    <!-- terminal -->
    <circle cx="553" cy="1305" r="42" fill="none" stroke="#00e676" stroke-width="10"/>
    <circle cx="625" cy="1305" r="42" fill="none" stroke="#00e676" stroke-width="10"/>
    <!-- green wire to OUT -->
    <path d="M205 820 C260 1000 420 1150 520 1270" stroke="#00e676" stroke-width="12" fill="none" stroke-dasharray="26 14"/>
    <path d="M520 1270 l-6 -40 l-30 24 z" fill="#00e676"/>
    <rect x="40" y="850" width="300" height="80" rx="16" fill="#2e7d32"/>
    <text x="190" y="905" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle" direction="rtl">سەوز ← OUT</text>
    <!-- purple to GND -->
    <rect x="700" y="1150" width="400" height="80" rx="16" fill="#6a1b9a"/>
    <text x="900" y="1205" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle" direction="rtl">بنەفشی ← GND</text>
    <path d="M700 1200 C680 1230 670 1260 660 1280" stroke="#ce93d8" stroke-width="10" fill="none"/>

    <rect x="740" y="1250" width="370" height="70" rx="14" fill="#fff" opacity="0.9"/>
    <text x="925" y="1298" font-size="30" fill="#1b1f24" text-anchor="middle" direction="rtl">🪛 بورغی قایم بکە</text>
    <!-- pins -->
    <rect x="640" y="1700" width="470" height="300" rx="18" fill="#000" opacity="0.75"/>
    <g font-size="38" font-weight="bold" font-family="DejaVu Sans Mono, monospace">
      <text x="665" y="1760" fill="#ff5252">VCC → 5V</text>
      <text x="665" y="1820" fill="#ffd740">IN  → 25</text>
      <text x="665" y="1880" fill="#fff">GND → GND</text>
      <text x="665" y="1940" fill="#bbb">GND → ڤالا</text>
    </g>
    <path d="M640 1820 L600 1810" stroke="#fff" stroke-width="6"/>
    <!-- speaker lead warning -->
    <circle cx="570" cy="810" r="70" fill="none" stroke="#ff9100" stroke-width="8"/>
    <rect x="640" y="560" width="460" height="130" rx="16" fill="#ff9100"/>
    <text x="870" y="615" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle" direction="rtl">⚠️ ئەڤ تێلا مسی ل سەر</text>
    <text x="870" y="665" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle" direction="rtl">بلندگۆی نەکێشە!</text>
  </g>
  <rect x="20" y="2120" width="1085" height="170" rx="20" fill="#f4f5f7" stroke="#d5dbe4" stroke-width="3"/>
  <g font-size="34" direction="rtl" text-anchor="start" fill="#1b1f24">
    <text x="1080" y="2180">١. بورغیێن سەوز ڤەکە ↺، سەرێ تێلێ بکە د کونێ دا، قایم بکە ↻</text>
    <text x="1080" y="2240" fill="#1565c0">٢. کیژ تێل بۆ OUT و کیژ بۆ GND، نە گرنگە ✓</text>
  </g>
