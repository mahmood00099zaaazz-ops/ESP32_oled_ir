<!doctype html>
<html><head><meta charset="utf-8"><title>Speaker Terminal Fix</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1500" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">پارچا سەوز (+ −) چاک بکە 🔊</text>

  <!-- 1 solder -->
  <rect x="30" y="90" width="700" height="430" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="140" r="26" fill="#ff3b30"/><text x="680" y="151" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="150" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ل پشتا ئەمپێ: لحیم هەیە؟</text>
  <text x="640" y="190" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">پارچا سەوز ب تنێ دهێت، دڤێت لحیم بکەی</text>
  <!-- bad -->
  <rect x="70" y="230" width="260" height="150" rx="10" fill="#5e35b1"/>
  <circle cx="160" cy="305" r="16" fill="#cfa040"/><circle cx="240" cy="305" r="16" fill="#cfa040"/>
  <circle cx="160" cy="305" r="6" fill="#5e35b1"/><circle cx="240" cy="305" r="6" fill="#5e35b1"/>
  <text x="200" y="420" font-size="21" fill="#c62828" font-weight="bold" text-anchor="middle" direction="rtl">✗ کونێن ڤالا</text>
  <text x="200" y="450" font-size="18" fill="#5d6878" text-anchor="middle" direction="rtl">دەنگ نائێت</text>
  <!-- good -->
  <rect x="420" y="230" width="260" height="150" rx="10" fill="#5e35b1"/>
  <circle cx="510" cy="305" r="20" fill="#d0d0d0"/><circle cx="590" cy="305" r="20" fill="#d0d0d0"/>
  <circle cx="510" cy="305" r="5" fill="#888"/><circle cx="590" cy="305" r="5" fill="#888"/>
  <text x="550" y="420" font-size="21" fill="#1e9e45" font-weight="bold" text-anchor="middle" direction="rtl">✓ لحیما زیڤی</text>
  <text x="550" y="450" font-size="18" fill="#5d6878" text-anchor="middle" direction="rtl">دەنگ دهێت</text>
  <text x="380" y="495" font-size="18" fill="#5d6878" text-anchor="middle" direction="rtl">ئەڤە پشتا ئەمپێ یە (ب ئەولا خوارێ)</text>

  <!-- 2 screw -->
  <rect x="30" y="540" width="700" height="420" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="590" r="26" fill="#14a3a8"/><text x="680" y="601" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="600" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">تێلێ ب دروستی بکە تێدا</text>
  <!-- terminal side -->
  <rect x="80" y="650" width="220" height="140" rx="8" fill="#2e7d32"/>
  <circle cx="140" cy="690" r="22" fill="#9e9e9e"/><path d="M125 690 h30" stroke="#333" stroke-width="5"/>
  <circle cx="240" cy="690" r="22" fill="#9e9e9e"/><path d="M225 690 h30" stroke="#333" stroke-width="5"/>
  <rect x="120" y="740" width="40" height="30" fill="#111"/><rect x="220" y="740" width="40" height="30" fill="#111"/>
  <path d="M140 840 V775" stroke="#fbc02d" stroke-width="9"/><path d="M140 775 V750" stroke="#d4884a" stroke-width="5"/>
  <path d="M240 840 V775" stroke="#1e88e5" stroke-width="9"/><path d="M240 775 V750" stroke="#d4884a" stroke-width="5"/>
  <text x="140" y="880" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">+</text>
  <text x="240" y="880" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">−</text>
  <g font-size="21" direction="rtl" text-anchor="start" fill="#1b1f24">
    <text x="640" y="680">١. بورغیێ ب دەرنەڤیسێ ڤەکە ↺</text>
    <text x="640" y="730">٢. سەرێ تێلێ ١ سم پاقژ بکە</text>
    <text x="640" y="760" font-size="18" fill="#d4884a">(مسێ سۆر دیار ببیت)</text>
    <text x="640" y="810">٣. مسی بکە د کونی دا</text>
    <text x="640" y="860">٤. بورغیێ قایم بکە ↻</text>
    <text x="640" y="910" fill="#1e9e45">٥. تێلێ هێدی بکێشە: نەهات = ✓</text>
  </g>

  <!-- 3 no solder iron -->
  <rect x="30" y="980" width="700" height="490" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="1030" r="26" fill="#34c759"/><text x="680" y="1041" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="1040" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ئەگەر پارچا سەوز سۆتبیت یان شکەستبیت</text>
  <text x="640" y="1080" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">وێ بهێلە، و تێلێن بلندگۆی راستەوخۆ لحیم بکە</text>
  <rect x="140" y="1120" width="480" height="150" rx="10" fill="#5e35b1"/>
  <text x="250" y="1200" font-size="22" fill="#fff" text-anchor="middle" direction="rtl">ئەمپ</text>
  <circle cx="440" cy="1195" r="18" fill="#d0d0d0"/><circle cx="540" cy="1195" r="18" fill="#d0d0d0"/>
  <text x="440" y="1160" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="540" y="1160" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <path d="M440 1195 C440 1320 400 1330 410 1360" stroke="#fbc02d" stroke-width="8" fill="none"/>
  <path d="M540 1195 C540 1320 520 1330 500 1360" stroke="#1e88e5" stroke-width="8" fill="none"/>
  <circle cx="455" cy="1390" r="45" fill="#222"/><circle cx="455" cy="1390" r="16" fill="#555"/>
  <text x="250" y="1400" font-size="20" fill="#333" text-anchor="middle" direction="rtl">بلندگۆ</text>
  <text x="380" y="1455" font-size="19" fill="#c62828" text-anchor="middle" direction="rtl">⚠️ کارەبێ ڤەکە بەری لحیمکرنێ</text>
</svg>
</body></html>
