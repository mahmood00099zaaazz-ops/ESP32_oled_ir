<!doctype html>
<html><head><meta charset="utf-8"><title>TP4056 Pads</title>

  <g transform="translate(0,-250)">
    <clipPath id="c"><rect x="0" y="350" width="1125" height="1200"/></clipPath>

    <!-- pads -->
    <circle cx="290" cy="832" r="30" fill="none" stroke="#ff1744" stroke-width="9"/>

    <path d="M290 800 L120 520" stroke="#ff1744" stroke-width="7"/>

  <rect x="30" y="1290" width="1065" height="930" rx="24" fill="#f4f5f7" stroke="#d5dbe4" stroke-width="3"/>

    <text x="1060" y="1440" font-weight="bold">٢. تێلا رەش یا باتریێ ← B−</text>
