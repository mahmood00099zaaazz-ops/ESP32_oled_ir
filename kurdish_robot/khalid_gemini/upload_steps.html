<!doctype html>
<html><head><meta charset="utf-8"><title>Upload Steps</title>
<style>body{margin:0;background:#f4f5f7}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1640" viewBox="0 0 760 1640" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1640" fill="#f4f5f7"/>
  <text x="380" y="58" font-size="32" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">کۆدی بکە ناڤ ESP32 ⬆️</text>

  <!-- 1 OTG -->
  <rect x="30" y="90" width="700" height="360" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="140" r="26" fill="#ff3b30"/><text x="680" y="151" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">١</text>
  <text x="640" y="150" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">ESP32 ب موبایلێ ڤە بکە (OTG)</text>
  <text x="640" y="188" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">نە شاحن! کابل دچیتە موبایلێ</text>
  <!-- phone -->
  <rect x="70" y="180" width="130" height="240" rx="20" fill="#222"/><rect x="82" y="200" width="106" height="190" rx="6" fill="#14a3a8"/>
  <text x="135" y="300" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Arduino</text>
  <text x="135" y="320" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Droid</text>
  <!-- otg adapter -->
  <rect x="122" y="420" width="26" height="14" fill="#999"/>
  <path d="M135 434 C135 445 230 440 260 400" stroke="#ddd" stroke-width="10" fill="none"/>
  <rect x="245" y="370" width="50" height="34" rx="6" fill="#555"/><text x="270" y="393" font-size="13" fill="#fff" text-anchor="middle">OTG</text>
  <path d="M295 387 C340 387 360 330 400 330" stroke="#ddd" stroke-width="10" fill="none"/>
  <!-- esp32 -->
  <rect x="400" y="280" width="210" height="110" rx="8" fill="#1b1f24"/>
  <rect x="420" y="300" width="80" height="70" fill="#d6cfc0"/>
  <circle cx="560" cy="350" r="7" fill="#ff1744"/>
  <rect x="390" y="315" width="20" height="30" rx="3" fill="#ccc"/>
  <text x="505" y="420" font-size="18" fill="#333" text-anchor="middle">ESP32</text>

  <!-- 2 compile -->
  <rect x="30" y="470" width="700" height="300" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="520" r="26" fill="#14a3a8"/><text x="680" y="531" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٢</text>
  <text x="640" y="530" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">⚡ Compile بکە</text>
  <text x="640" y="568" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">چاڤەرێ بە هەتا Done دیار دبیت</text>
  <rect x="70" y="600" width="420" height="80" rx="10" fill="#000"/>
  <text x="90" y="650" font-size="22" font-weight="bold" fill="#14a3a8">ArduinoDroid</text>
  <circle cx="330" cy="640" r="26" fill="none" stroke="#ff3b30" stroke-width="5"/>
  <path d="M336 620 L320 644 L330 644 L325 662 L342 636 L332 636 Z" fill="#fff"/>
  <path d="M395 622 v24 M385 637 l10 10 l10 -10 M383 658 h24" stroke="#fff" stroke-width="4" fill="none"/>
  <path d="M440 658 l18 -22 M452 628 l4 6" stroke="#fff" stroke-width="4" fill="none"/>
  <text x="280" y="735" font-size="19" fill="#c62828" text-anchor="middle" direction="rtl">ئەڤ ⚡ بکە</text>

  <!-- 3 upload -->
  <rect x="30" y="790" width="700" height="380" rx="22" fill="#fff" stroke="#d5dbe4" stroke-width="2"/>
  <circle cx="680" cy="840" r="26" fill="#34c759"/><text x="680" y="851" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٣</text>
  <text x="640" y="850" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">⋮ ← Upload بکە</text>
  <text x="640" y="888" font-size="19" fill="#5d6878" direction="rtl" text-anchor="start">ئەگەر پرسیار کر: Allow USB ← OK</text>
  <rect x="70" y="920" width="420" height="80" rx="10" fill="#000"/>
  <text x="90" y="970" font-size="22" font-weight="bold" fill="#14a3a8">ArduinoDroid</text>
  <circle cx="465" cy="945" r="4" fill="#fff"/><circle cx="465" cy="960" r="4" fill="#fff"/><circle cx="465" cy="975" r="4" fill="#fff"/>
  <circle cx="465" cy="960" r="24" fill="none" stroke="#ff3b30" stroke-width="5"/>
  <rect x="290" y="1010" width="200" height="130" rx="8" fill="#2b3040"/>
  <text x="310" y="1045" font-size="18" fill="#cfd6e4">Sketch</text>
  <rect x="300" y="1060" width="180" height="36" rx="4" fill="#3d4560" stroke="#34c759" stroke-width="3"/>
  <text x="315" y="1085" font-size="18" fill="#fff" font-weight="bold">Upload ⬆️</text>
  <text x="310" y="1125" font-size="18" fill="#cfd6e4">Settings</text>
  <path d="M465 985 C470 1010 480 1030 485 1060" stroke="#ff3b30" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
  <text x="160" y="1080" font-size="19" fill="#5d6878" text-anchor="middle" direction="rtl">یان ئایکۆنا ⬇️</text>

  <!-- 4 done -->
  <rect x="30" y="1190" width="700" height="420" rx="22" fill="#fff" stroke="#34c759" stroke-width="4"/>
  <circle cx="680" cy="1240" r="26" fill="#5d6878"/><text x="680" y="1251" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">٤</text>
  <text x="640" y="1250" font-size="24" font-weight="bold" fill="#1b1f24" direction="rtl" text-anchor="start">OUTPUT ببینە 📸</text>
  <rect x="70" y="1290" width="620" height="190" rx="10" fill="#0b0b0b"/>
  <g font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#9be59b">
    <text x="90" y="1325">Connecting.....</text>
    <text x="90" y="1355">Writing at 0x00010000 (100 %)</text>
    <text x="90" y="1385">Hash of data verified.</text>
    <text x="90" y="1430" fill="#fff" font-weight="bold" font-size="24">Done ✓</text>
  </g>
  <g direction="rtl" text-anchor="start" font-size="20">
    <text x="690" y="1520" fill="#1e9e45" font-weight="bold">✓ Done = ESP32 باشە 🎉</text>
    <text x="690" y="1555" fill="#c62828">✗ Connecting... ب تنێ: دوگما BOOT بگرە هەتا دەست پێدکەت</text>
    <text x="690" y="1590" fill="#5d6878">وێنێ OUTPUT بۆ من بهنێرە</text>
  </g>
</svg>
</body></html>
