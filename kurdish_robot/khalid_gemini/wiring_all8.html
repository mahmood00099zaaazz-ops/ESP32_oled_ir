<!doctype html>
<html><head><meta charset="utf-8"><title>Khalid Full Wiring</title>
<style>body{margin:0;background:#fff}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1720" viewBox="0 0 760 1720" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="1720" fill="#fff"/>
  <text x="380" y="48" font-size="30" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">هەمی تێلێن رۆبۆتی (وەکی کۆدی)</text>

  <!-- OLED -->
  <rect x="240" y="80" width="280" height="130" rx="8" fill="#1565c0"/>
  <g font-size="17" font-weight="bold" fill="#fff" text-anchor="middle"><text x="290" y="106">VCC</text><text x="350" y="106">GND</text><text x="410" y="106">SCL</text><text x="470" y="106">SDA</text></g>
  <rect x="265" y="118" width="230" height="72" rx="4" fill="#000"/>
  <rect x="320" y="135" width="38" height="26" rx="7" fill="#7fdcff"/><rect x="402" y="135" width="38" height="26" rx="7" fill="#7fdcff"/>
  <text x="380" y="182" font-size="15" fill="#7fdcff" text-anchor="middle">شاشە</text>
  <path d="M290 210 V340" stroke="#e53935" stroke-width="7"/><path d="M350 210 V340" stroke="#555" stroke-width="7"/>
  <path d="M410 210 V340" stroke="#7b1fa2" stroke-width="7"/><path d="M470 210 V340" stroke="#2e7d32" stroke-width="7"/>

  <!-- ESP32 -->
  <rect x="30" y="340" width="700" height="130" rx="10" fill="#7b1f1f"/>
  <g font-size="17" font-weight="bold" fill="#ffd54f" text-anchor="middle"><text x="290" y="366">3V3</text><text x="350" y="366">GND</text><text x="410" y="366">22</text><text x="470" y="366">21</text></g>
  <text x="380" y="418" font-size="38" font-weight="bold" fill="#fff" text-anchor="middle">ESP32</text>
  <g font-size="17" font-weight="bold" fill="#ffd54f" text-anchor="middle">
    <text x="70" y="460">3V3</text><text x="130" y="460">GND</text><text x="190" y="460">GND</text><text x="250" y="460">33</text><text x="310" y="460">32</text><text x="370" y="460">35</text>
    <text x="520" y="460">5V</text><text x="590" y="460">GND</text><text x="660" y="460">25</text></g>
  <rect x="730" y="380" width="22" height="50" rx="4" fill="#ccc"/>

  <!-- mic wires -->
  <path d="M70 470 V600" stroke="#e53935" stroke-width="7"/><path d="M130 470 V600" stroke="#555" stroke-width="7"/>
  <path d="M190 470 V600" stroke="#555" stroke-width="7"/><path d="M250 470 V600" stroke="#fb8c00" stroke-width="7"/>
  <path d="M310 470 V600" stroke="#1e88e5" stroke-width="7"/><path d="M370 470 V600" stroke="#2e7d32" stroke-width="7"/>
  <!-- amp wires -->
  <path d="M520 470 V600" stroke="#e53935" stroke-width="7"/><path d="M590 470 V600" stroke="#555" stroke-width="7"/>
  <path d="M660 470 V600" stroke="#fb8c00" stroke-width="7"/>

  <!-- mic -->
  <rect x="30" y="600" width="380" height="160" rx="10" fill="#263238"/>
  <g font-size="16" font-weight="bold" fill="#fff" text-anchor="middle"><text x="70" y="626">VDD</text><text x="130" y="626">GND</text><text x="190" y="626">L/R</text><text x="250" y="626">WS</text><text x="310" y="626">SCK</text><text x="370" y="626">SD</text></g>
  <circle cx="220" cy="690" r="34" fill="#222" stroke="#c9a54a" stroke-width="5"/><circle cx="220" cy="690" r="9" fill="#888"/>
  <text x="220" y="748" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">مایک</text>

  <!-- LM386 -->
  <rect x="440" y="600" width="290" height="160" rx="10" fill="#0d47a1"/>
  <g font-size="16" font-weight="bold" fill="#fff" text-anchor="middle"><text x="520" y="626">VCC</text><text x="590" y="626">GND</text><text x="660" y="626">IN</text></g>
  <rect x="460" y="660" width="80" height="60" rx="5" fill="#4caf50"/>
  <circle cx="482" cy="690" r="11" fill="#2e7d32"/><circle cx="518" cy="690" r="11" fill="#2e7d32"/>
  <circle cx="660" cy="690" r="20" fill="#1e88e5"/><circle cx="660" cy="690" r="12" fill="#eee"/>
  <text x="600" y="745" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">LM386</text>
  <!-- speaker -->
  <path d="M482 700 C482 800 520 810 540 830" stroke="#fbc02d" stroke-width="6" fill="none"/>
  <path d="M518 700 C518 790 560 800 575 825" stroke="#1e88e5" stroke-width="6" fill="none"/>
  <circle cx="565" cy="870" r="48" fill="#222"/><circle cx="565" cy="870" r="18" fill="#555"/>
  <text x="660" y="880" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">بلندگۆ</text>

  <g font-size="18" fill="#c62828" font-weight="bold" direction="rtl" text-anchor="middle">
    <text x="220" y="805">3V3 ← مایک و شاشە</text>
    <text x="220" y="835">5V ← LM386</text>
  </g>
  <text x="220" y="870" font-size="15" fill="#5d6878" text-anchor="middle" direction="rtl">3V3 تنێ ئێک پینە: هەردو تێلان پێکڤە بکە</text>

  <!-- power -->
  <path d="M40 930 H720" stroke="#ddd" stroke-width="3"/>
  <text x="380" y="975" font-size="26" font-weight="bold" fill="#1b1f24" text-anchor="middle" direction="rtl">کارەبا: باتری 🔋</text>

  <!-- battery -->
  <rect x="50" y="1030" width="160" height="100" rx="10" fill="#222"/>
  <text x="70" y="1058" font-size="22" fill="#e53935" font-weight="bold">+</text><text x="185" y="1058" font-size="22" fill="#1e88e5" font-weight="bold">−</text>
  <text x="130" y="1088" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">باتری</text>
  <text x="130" y="1113" font-size="15" fill="#bbb" text-anchor="middle">3.6V</text>
  <!-- TP4056 -->
  <rect x="280" y="1020" width="190" height="110" rx="8" fill="#1565c0"/>
  <text x="375" y="1083" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">TP4056</text>
  <g font-size="14" font-weight="bold" fill="#ffd54f"><text x="288" y="1040">B+</text><text x="420" y="1040">OUT+</text><text x="288" y="1124">B−</text><text x="420" y="1124">OUT−</text></g>
  <rect x="355" y="1130" width="40" height="16" rx="3" fill="#ccc"/><text x="375" y="1165" font-size="13" fill="#333" text-anchor="middle" direction="rtl">USB شەحن</text>
  <path d="M70 1030 V1000 H300 V1022" stroke="#e53935" stroke-width="6" fill="none"/>
  <path d="M190 1120 V1160 H300 V1128" stroke="#222" stroke-width="6" fill="none"/>
  <!-- switch -->
  <circle cx="590" cy="1060" r="30" fill="#e53935" stroke="#222" stroke-width="6"/>
  <text x="590" y="1115" font-size="17" fill="#333" text-anchor="middle" direction="rtl">سویچ</text>
  <path d="M465 1035 H520 V1060 H560" stroke="#e53935" stroke-width="6" fill="none"/>
  <path d="M620 1060 H690 V1225 H660" stroke="#e53935" stroke-width="6" fill="none"/>
  <!-- MT3608 -->
  <rect x="280" y="1200" width="390" height="120" rx="8" fill="#1565c0"/>
  <rect x="300" y="1220" width="34" height="34" rx="4" fill="#1e88e5" stroke="#fff" stroke-width="2"/><circle cx="317" cy="1237" r="8" fill="#fff"/>
  <text x="470" y="1270" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">MT3608 = 5.0V</text>
  <g font-size="14" font-weight="bold" fill="#ffd54f"><text x="455" y="1222">VIN−</text><text x="600" y="1222">VIN+</text><text x="290" y="1310">VOUT+</text><text x="365" y="1310">VOUT−</text></g>
  <path d="M455 1128 H475 V1205" stroke="#222" stroke-width="6" fill="none"/>
  <!-- to ESP32 -->
  <rect x="40" y="1380" width="70" height="70" rx="6" fill="#7b1f1f"/>
  <text x="75" y="1408" font-size="16" font-weight="bold" fill="#ffd54f" text-anchor="middle">5V</text>
  <text x="75" y="1436" font-size="16" font-weight="bold" fill="#ffd54f" text-anchor="middle">GND</text>
  <text x="75" y="1472" font-size="15" fill="#333" text-anchor="middle">ESP32</text>
  <path d="M315 1318 V1402 H110" stroke="#e53935" stroke-width="6" fill="none"/>
  <path d="M390 1318 V1430 H110" stroke="#222" stroke-width="6" fill="none"/>

  <!-- warnings -->
  <rect x="30" y="1500" width="700" height="200" rx="14" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <g font-size="18" direction="rtl" text-anchor="start" fill="#b71c1c">
    <text x="710" y="1540">⚠️ بەری گرێدانێ: بورغیێ شین یێ MT3608 بزڤڕینە هەتا 5.0V (ب Multimeter)</text>
    <text x="710" y="1575">⚠️ دەمێ Upload دکەی: سویچ OFF بکە</text>
    <text x="710" y="1610">⚠️ USB یا MT3608 بکار نەئینە، تنێ USB یا TP4056 بۆ شەحنێ</text>
    <text x="710" y="1645" fill="#1565c0">🔵 دوگما شین یا LM386 = بلندیا دەنگی</text>
    <text x="710" y="1680" fill="#5d6878">شاشە ل وێنێ تە نەبوو، بەلێ بۆ چاڤێن رۆبۆتی پێدڤی یە 🖥️</text>
  </g>
</svg>
</body></html>
