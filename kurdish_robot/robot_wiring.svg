<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="640" fill="#1e1f24"/>
  <text x="450" y="36" fill="#fff" font-size="24" text-anchor="middle" font-weight="bold">Robotê Zîrek — Kurdî Badînî</text>
  <text x="450" y="60" fill="#aab" font-size="14" text-anchor="middle">Raspberry Pi 5 (mêjî) + ESP32 + OLED (rû) + IR (çav)</text>

  <!-- Raspberry Pi 5 -->
  <rect x="40" y="110" width="260" height="170" rx="12" fill="#1b7a3a" stroke="#7fd99a" stroke-width="2"/>
  <text x="170" y="145" fill="#fff" font-size="20" text-anchor="middle" font-weight="bold">Raspberry Pi 5</text>
  <text x="170" y="168" fill="#d6ffe0" font-size="14" text-anchor="middle">4GB / 8GB — MÊJÎ</text>
  <text x="170" y="195" fill="#d6ffe0" font-size="13" text-anchor="middle">Claude AI + dengê kurdî</text>
  <rect x="270" y="200" width="30" height="20" fill="#ccc"/><text x="285" y="214" font-size="9" text-anchor="middle">USB</text>
  <rect x="270" y="230" width="30" height="20" fill="#ccc"/><text x="285" y="244" font-size="9" text-anchor="middle">USB</text>
  <rect x="270" y="170" width="30" height="20" fill="#ccc"/><text x="285" y="184" font-size="9" text-anchor="middle">USB</text>
  <rect x="40" y="250" width="40" height="20" fill="#ccc"/><text x="60" y="264" font-size="9" text-anchor="middle">USB-C</text>

  <!-- Power -->
  <rect x="40" y="330" width="180" height="60" rx="8" fill="#333" stroke="#f5c542" stroke-width="2"/>
  <text x="130" y="355" fill="#f5c542" font-size="15" text-anchor="middle" font-weight="bold">Power 5V 5A</text>
  <text x="130" y="375" fill="#ddd" font-size="12" text-anchor="middle">USB-C 27W (fermî)</text>
  <path d="M60 330 V270" stroke="#f5c542" stroke-width="4" fill="none"/>

  <!-- Mic & speaker -->
  <rect x="380" y="100" width="150" height="50" rx="8" fill="#444" stroke="#9cf" stroke-width="2"/>
  <text x="455" y="123" fill="#fff" font-size="14" text-anchor="middle">🎤 USB Mic</text>
  <text x="455" y="141" fill="#9cf" font-size="11" text-anchor="middle">guhdarî — گوهـ</text>
  <rect x="380" y="170" width="150" height="50" rx="8" fill="#444" stroke="#9cf" stroke-width="2"/>
  <text x="455" y="193" fill="#fff" font-size="14" text-anchor="middle">🔊 USB Speaker</text>
  <text x="455" y="211" fill="#9cf" font-size="11" text-anchor="middle">axaftin — دەڤ</text>
  <path d="M300 180 H340 V125 H380" stroke="#9cf" stroke-width="3" fill="none"/>
  <path d="M300 210 H350 V195 H380" stroke="#9cf" stroke-width="3" fill="none"/>

  <!-- ESP32 -->
  <rect x="380" y="290" width="150" height="270" rx="10" fill="#111" stroke="#888" stroke-width="2"/>
  <rect x="405" y="300" width="100" height="70" fill="#bbb"/>
  <text x="455" y="342" fill="#222" font-size="18" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="455" y="395" fill="#fff" font-size="12" text-anchor="middle">RÛ — رووی رۆبۆتی</text>
  <rect x="435" y="540" width="40" height="20" fill="#ccc"/><text x="455" y="554" font-size="9" text-anchor="middle">USB</text>
  <!-- ESP32 pins (right side) -->
  <g font-size="11" fill="#ffd54f">
    <circle cx="530" cy="420" r="5"/><text x="520" y="424" text-anchor="end">3V3</text>
    <circle cx="530" cy="445" r="5"/><text x="520" y="449" text-anchor="end">GND</text>
    <circle cx="530" cy="470" r="5"/><text x="520" y="474" text-anchor="end">G22 SCL</text>
    <circle cx="530" cy="495" r="5"/><text x="520" y="499" text-anchor="end">G21 SDA</text>
    <circle cx="530" cy="520" r="5"/><text x="520" y="524" text-anchor="end">G34</text>
  </g>
  <!-- Pi <-> ESP32 USB cable -->
  <path d="M300 240 H330 V600 H455 V560" stroke="#ccc" stroke-width="4" fill="none" stroke-dasharray="10 5"/>
  <text x="340" y="590" fill="#ccc" font-size="11">USB cable (serial)</text>

  <!-- OLED -->
  <rect x="660" y="300" width="200" height="130" rx="8" fill="#1565c0" stroke="#90caf9" stroke-width="2"/>
  <rect x="680" y="335" width="160" height="80" fill="#000"/>
  <rect x="705" y="350" width="40" height="40" rx="8" fill="#4fc3f7"/>
  <rect x="775" y="350" width="40" height="40" rx="8" fill="#4fc3f7"/>
  <rect x="745" y="400" width="30" height="5" fill="#4fc3f7"/>
  <g font-size="10" fill="#fff" text-anchor="middle">
    <text x="690" y="318">GND</text><text x="725" y="318">VCC</text><text x="760" y="318">SCL</text><text x="795" y="318">SDA</text>
  </g>
  <text x="760" y="450" fill="#fff" font-size="13" text-anchor="middle">OLED 128x64 (çav)</text>

  <!-- IR sensor -->
  <rect x="660" y="490" width="200" height="80" rx="8" fill="#2e7d32" stroke="#a5d6a7" stroke-width="2"/>
  <circle cx="690" cy="530" r="12" fill="#222"/><circle cx="720" cy="530" r="12" fill="#ddd"/>
  <g font-size="10" fill="#fff" text-anchor="middle">
    <text x="770" y="510">OUT</text><text x="805" y="510">GND</text><text x="840" y="510">VCC</text>
  </g>
  <text x="790" y="555" fill="#fff" font-size="12" text-anchor="middle">IR sensor</text>

  <!-- Wires ESP32 -> OLED -->
  <path d="M535 420 H600 V285 H725 V310" stroke="#e53935" stroke-width="3" fill="none"/>
  <path d="M535 445 H610 V295 H690 V310" stroke="#9e9e9e" stroke-width="3" fill="none"/>
  <path d="M535 470 H620 V305 H760 V310" stroke="#1e88e5" stroke-width="3" fill="none"/>
  <path d="M535 495 H630 V280 H795 V310" stroke="#fb8c00" stroke-width="3" fill="none"/>
  <!-- Wires ESP32 -> IR -->
  <path d="M535 520 H770 V515" stroke="#43a047" stroke-width="3" fill="none"/>
  <path d="M610 445 V600 H805 V515" stroke="#9e9e9e" stroke-width="3" fill="none"/>
  <path d="M600 420 V610 H840 V515" stroke="#e53935" stroke-width="3" fill="none"/>

  <!-- Legend -->
  <g font-size="12" fill="#ddd">
    <text x="40" y="440" font-weight="bold" fill="#fff">Têlên (wires):</text>
    <text x="40" y="462"><tspan fill="#e53935">■</tspan> 3V3 → VCC (OLED + IR)</text>
    <text x="40" y="482"><tspan fill="#888">■</tspan> GND → GND</text>
    <text x="40" y="502"><tspan fill="#1e88e5">■</tspan> GPIO22 → SCL</text>
    <text x="40" y="522"><tspan fill="#fb8c00">■</tspan> GPIO21 → SDA</text>
    <text x="40" y="542"><tspan fill="#43a047">■</tspan> GPIO34 → IR OUT</text>
    <text x="40" y="562"><tspan fill="#ccc">■</tspan> Pi USB → ESP32 USB</text>
  </g>
</svg>
